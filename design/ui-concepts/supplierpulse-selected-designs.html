<script>
(() => {
  const root = document.getElementById('supplierpulse-selected-ui-concepts');
  const icon = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const money = (n) => Number(n).toLocaleString('en-GB');
  const orders = [
    {id:0,name:'Motor supply',ref:'PO-1001',registry:'Companies House',source:'CH',supplier:'03778796',total:3000,paid:500,remaining:2500,next:1000,steps:[500,1000,1500],closed:false,reason:'Payment permit expired',detail:'A fresh signed record is needed before the next milestone can be paid.',tier:'Premium',raw:'{\n  "status": "active",\n  "accounts_overdue": false,\n  "confirmation_overdue": false\n}',fields:[['Company status','Active'],['Accounts','Filed'],['Confirmation statement','Filed']]},
    {id:1,name:'Gearbox',ref:'PO-1002',registry:'Companies House',source:'CH',supplier:'07418033',total:3000,paid:0,remaining:0,next:0,steps:[1000,2000],closed:true,reason:'Company in liquidation',detail:'The registry status failed. All remaining funds were returned to the buyer.',tier:'Standard',raw:'{\n  "status": "liquidation",\n  "accounts_overdue": true,\n  "confirmation_overdue": true\n}',fields:[['Company status','Liquidation'],['Accounts','Overdue'],['Confirmation statement','Overdue']]},
    {id:2,name:'Sensors',ref:'PO-1003',registry:'Companies House',source:'CH',supplier:'09729896',total:1000,paid:0,remaining:0,next:0,steps:[500,500],closed:true,reason:'Accounts overdue',detail:'The buyer’s filing rule failed. The company being active was not enough to permit payment.',tier:'Standard',raw:'{\n  "status": "active",\n  "accounts_overdue": true,\n  "confirmation_overdue": true\n}',fields:[['Company status','Active'],['Accounts','Overdue'],['Confirmation statement','Overdue']]},
    {id:3,name:'Cable harness',ref:'PO-1004',registry:'GLEIF',source:'LEI',supplier:'391200JI69LS8L648F30',total:1500,paid:500,remaining:1000,next:1000,steps:[500,1000],closed:false,reason:'Payment permit expired',detail:'The previous record passed the rules. A new record is required for the next payment.',tier:'Trusted',raw:'{\n  "entity_status": "ACTIVE",\n  "registration_status": "ISSUED"\n}',fields:[['Entity status','Active'],['LEI registration','Issued']]},
    {id:4,name:'Castings',ref:'PO-1005',registry:'GLEIF',source:'LEI',supplier:'52990092KBQJF8QBGJ50',total:1000,paid:0,remaining:0,next:0,steps:[500,500],closed:true,reason:'LEI renewal overdue',detail:'The LEI registration lapsed. The order was refunded; this does not mean the entity is bankrupt.',tier:'Standard',raw:'{\n  "entity_status": "ACTIVE",\n  "registration_status": "LAPSED"\n}',fields:[['Entity status','Active'],['LEI registration','Lapsed']]}
  ];
  const cases = [
    {key:'valid',name:'Fresh, matching record',sub:'Expected Airnode and request',error:'Permit issued',good:true,why:'A fresh clean record can issue a payment permit. Buyer approval and the due date still control release.'},
    {key:'value',name:'Edited value',sub:'Original signature, changed data',error:'WrongSigner',why:'Changing a signed value changes the recovered signer. The record must be rejected.'},
    {key:'old',name:'Genuine old record',sub:'Untouched, signed earlier',error:'StaleResponse',why:'The signed record is authentic but outside the accepted age window.'},
    {key:'request',name:'Other company',sub:'Genuine different-request record',error:'WrongRequest',why:'An authentic record for a different supplier cannot authorize this order.'},
    {key:'key',name:'Wrong signing key',sub:'Signed by a different key',error:'WrongSigner',why:'Only the configured Airnode signer for this registry is accepted.'},
    {key:'replay',name:'Previously used record',sub:'Same digest a second time',error:'Replayed',why:'The contract refuses an already consumed signed response.'}
  ];
  const states = {};
  const brand = () => `<div class="sp-brand"><span class="sp-brandmark">${icon('activity')}</span>SupplierPulse<span class="sp-plus">+</span></div>`;
  const badge = (o) => `<span class="sp-pill ${o.closed?'':'sp-wait'}">${icon(o.closed?'rotate-ccw':'clock-3')}${o.closed?'Refunded':'Fresh check needed'}</span>`;
  const preview = () => `<span class="sp-preview">${icon('flask-conical')}Design preview · sample data</span>`;
  const mode = (s) => `<div class="sp-mode" role="group" aria-label="Information density"><button class="cursor-interaction" data-mode="simple" aria-pressed="${s.mode==='simple'}">Simple</button><button class="cursor-interaction" data-mode="complex" aria-pressed="${s.mode==='complex'}">Complex</button></div>`;
  const footer = () => `<footer class="sp-footer"><span class="sp-row">${icon('hexagon')}Ethereum Sepolia · demo units</span><span>No wallet connection or payments in this preview</span></footer>`;
  const selected = (s) => orders.find(o=>o.id===s.order)||orders[0];
  const kv = (pairs) => `<dl class="sp-kv">${pairs.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>`;
  const filters = (s) => `<div class="sp-filters" role="group" aria-label="Filter orders">${[['all','All orders'],['open','Open'],['closed','Refunded']].map(([k,l])=>`<button class="cursor-interaction" data-filter="${k}" aria-pressed="${s.filter===k}">${l}</button>`).join('')}</div>`;
  const table = (s) => `<div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>Order</th><th>Registry</th><th>Status</th><th class="sp-num">Remaining</th></tr></thead><tbody>${orders.filter(o=>s.filter==='all'||(s.filter==='closed' ? o.closed : !o.closed)).map(o=>`<tr data-selected="${o.id===s.order}"><td><button class="cursor-interaction" data-order="${o.id}" aria-label="Open ${o.name}">${o.name}</button><div class="sp-muted sp-small">${o.ref}</div></td><td class="sp-muted">${o.source}</td><td>${badge(o)}</td><td class="sp-num">${money(o.remaining)}</td></tr>`).join('')}</tbody></table></div>`;
  const milestone = (o) => o.steps.map((amount,i)=>`<div class="sp-step"><span class="sp-step-icon ${o.paid>0&&i===0?'sp-done':(!o.closed&&i===1?'sp-alert':'')}">${icon(o.paid>0&&i===0?'check':o.closed?'minus':'clock-3')}</span><div style="flex:1"><div class="sp-row sp-between"><span>Milestone ${i+1}</span><strong>${money(amount)}</strong></div><div class="sp-small sp-muted">${o.paid>0&&i===0?'Paid to supplier':o.closed?'Closed · refunded to buyer':i===1?'Buyer approved · awaiting fresh check':'Upcoming'}</div></div></div>`).join('');
  const notice = (o) => `<div class="sp-note">${icon(o.closed?'rotate-ccw':'clock-3')}<div><strong>${o.closed?'Order closed':o.reason}</strong><p class="sp-small" style="margin-top:4px">${o.detail}</p></div></div>`;
  const details = (o,complex=false) => `<div class="sp-sheet sp-padding"><div class="sp-row sp-between"><h3>${o.ref}</h3>${icon('file-check-2')}</div><h2 style="margin-top:8px">${o.name}</h2><p class="sp-small sp-muted" style="margin:5px 0 18px">${o.registry} · ${o.supplier}</p><div class="sp-overline">${o.closed?'Returned to buyer':'Next milestone'}</div><div style="font-size:31px;letter-spacing:-1px;margin:5px 0 12px">${money(o.closed?o.total-o.paid:o.next)} <span class="sp-small sp-muted" style="letter-spacing:0">demo units</span></div>${notice(o)}${complex?`<details class="sp-disclosure"><summary class="cursor-interaction">Milestones and policy</summary>${milestone(o)}${kv([['Permit',o.closed?'None · order closed':'Expired'],['Submission max age','300 seconds'],['Permit lifetime','1,800 seconds'],['History tier',o.tier]])}</details>`:`<button class="sp-button sp-quiet cursor-interaction" data-mode="complex" style="margin-top:13px">Review milestones ${icon('arrow-right')}</button>`}</div>`;
  const proof = (o) => `<div class="sp-sheet sp-padding"><div class="sp-row sp-between"><h3>Signed registry record</h3><span class="sp-pill">${o.source}</span></div><p class="sp-small sp-muted" style="margin:8px 0 13px">Last accepted record · historical example</p><div>${o.fields.map(([a,b])=>`<div class="sp-line-item sp-small"><span class="sp-muted">${a}</span><span>${b}</span></div>`).join('')}</div><details class="sp-disclosure"><summary class="cursor-interaction">Exact signed fields</summary><pre class="sp-code" style="margin-top:12px">${o.raw}</pre></details><div class="sp-rule"></div><div class="sp-small sp-muted">An authentic registry record does not prove delivery or wallet ownership.</div></div>`;
  const checks = () => `<div class="sp-sheet sp-padding"><h3>Release conditions</h3><div style="margin-top:10px"><div class="sp-check">${icon('circle-check')}Buyer approval<span>Approved</span></div><div class="sp-check">${icon('circle-check')}Registry rules<span>Last check passed</span></div><div class="sp-check sp-expired">${icon('clock-3')}Payment permit<span>Expired</span></div><div class="sp-check sp-expired">${icon('calendar-clock')}Milestone due<span>Upcoming</span></div></div><button class="sp-button" disabled style="width:100%;margin-top:12px">${icon('lock-keyhole')}Payment unavailable</button></div>`;
  const eventLog = (o) => `<details class="sp-sheet sp-padding"><summary class="cursor-interaction">Decision trail</summary><div class="sp-log-line"><span>01</span><p>Buyer funded the order.<br><span class="sp-muted">${money(o.total)} demo units locked.</span></p></div><div class="sp-log-line"><span>02</span><p>Airnode record accepted.<br><span class="sp-muted">${o.registry} · ${o.supplier}</span></p></div><div class="sp-log-line"><span>03</span><p>${o.closed?'Funds returned to buyer.':'First milestone paid.'}<br><span class="sp-muted">${o.closed?o.reason:money(o.paid)+' demo units released.'}</span></p></div></details>`;

  function lab(s) {
    const c=cases.find(c=>c.key===s.test)||cases[0];
    return `<div class="sp-lab-heading"><div class="sp-overline">Verification lab</div><h1 style="margin-top:10px">Trust the proof.</h1><p class="sp-muted" style="margin-top:9px">A clear answer for every signed record.</p></div><div class="sp-lab-grid"><section><div class="sp-row sp-between"><h3>Choose a scenario</h3><span class="sp-pill">Illustrative outcomes</span></div><div class="sp-cases">${cases.filter((c,i)=>s.mode==='complex'||i!==5).map(c=>`<button class="sp-case cursor-interaction" data-case="${c.key}" aria-pressed="${c.key===s.test}">${icon(c.good?'file-check-2':'shield-alert')}<div><span>${c.name}</span><small>${c.sub}</small></div></button>`).join('')}</div><div class="sp-result ${c.good?'':'sp-rejected'}" role="status">${icon(c.good?'shield-check':'shield-x')}<div class="sp-overline" style="color:inherit;margin-top:12px">Expected contract result</div><h2>${c.error}</h2><p>${c.why}</p></div>${s.mode==='complex'?`<div class="sp-sheet sp-padding"><h3>Verification checks</h3>${kv([['Request','Supplier-bound request hash'],['Time','Fresh signed timestamp'],['Signature','Configured Airnode'],['Replay','Unused response digest'],['Policy','Buyer’s registry rules']])}</div>`:''}</section><aside><div class="sp-sheet sp-padding"><h3>From record to payment</h3><div class="sp-step"><span class="sp-step-icon">1</span><div>Authenticate record<p class="sp-small sp-muted">Signer, request and timing.</p></div></div><div class="sp-step"><span class="sp-step-icon">2</span><div>Issue permit or hold<p class="sp-small sp-muted">Apply the order’s rules.</p></div></div><div class="sp-step"><span class="sp-step-icon">3</span><div>Release only when eligible<p class="sp-small sp-muted">Buyer approval + due date + valid permit.</p></div></div><div class="sp-rule"></div><p class="sp-small sp-muted">These are design examples. No record is submitted and no transaction is sent.</p></div></aside></div>`;
  }

  function ledger(s) {
    const o=selected(s);
    return `<aside class="sp-ledger-side">${brand()}<nav class="sp-side-nav" aria-label="Main navigation"><button class="cursor-interaction" data-page="orders" ${s.page==='orders'?'aria-current="page"':''}>${icon('layout-dashboard')}Payments</button><button class="cursor-interaction" data-page="lab" ${s.page==='lab'?'aria-current="page"':''}>${icon('shield-check')}Verify a record</button></nav><div class="sp-side-foot"><div class="sp-overline">Workspace</div><div class="sp-row" style="margin-top:12px"><span class="sp-avatar">PP</span><span>Powerpuffgirls<br>Demo workspace</span></div></div></aside><main class="sp-ledger-main"><div class="sp-row sp-between sp-wrap">${preview()}${mode(s)}</div>${s.page==='lab'?lab(s):`<header class="sp-ledger-hero"><div class="sp-overline">Payments / Overview</div><h1 style="margin:10px 0">Every payment,<br>with a reason.</h1><p class="sp-muted">See what’s paid, what’s protected, and what happens next.</p></header><div class="sp-ledger-summary"><div><div class="sp-overline">Remaining in escrow</div><div class="sp-metric">3,500</div><div class="sp-small sp-muted" style="margin-top:8px">demo units · 2 open orders</div></div><div><div class="sp-overline">Paid to suppliers</div><div class="sp-summary-minor">1,000</div><div class="sp-small sp-muted" style="margin-top:8px">2 milestones</div></div><div><div class="sp-overline">Returned to buyer</div><div class="sp-summary-minor">5,000</div><div class="sp-small sp-muted" style="margin-top:8px">3 refunded orders</div></div></div><div class="sp-ledger-work"><section><div class="sp-row sp-between sp-wrap"><h2>${s.mode==='simple'?'Your orders':'Payment register'}</h2>${s.mode==='complex'?filters(s):'<span class="sp-small sp-muted">5 orders</span>'}</div>${s.mode==='complex'?`<div class="sp-sheet" style="margin-top:14px">${table(s)}</div><div style="margin-top:16px">${proof(o)}</div>`:orders.map(x=>`<button class="sp-order-choice cursor-interaction" data-order="${x.id}" aria-pressed="${x.id===s.order}"><div class="sp-choice-title"><div><strong>${x.name}</strong><span class="sp-small sp-muted">${x.ref} · ${x.registry}</span></div><span class="sp-amount">${money(x.remaining)}</span></div><div class="sp-choice-bottom">${badge(x)}${icon('arrow-up-right')}</div></button>`).join('')}</section><aside>${details(o,s.mode==='complex')}<div class="sp-sheet sp-padding" style="margin-top:14px"><div class="sp-row">${icon('shield-check')}<h3>Two conditions, one payment</h3></div><p class="sp-small sp-muted" style="margin-top:9px">The buyer approves the stage. A valid registry permit authorizes the payment.</p><button class="sp-button sp-quiet cursor-interaction" data-page="lab" style="margin-top:13px">Explore verification ${icon('arrow-right')}</button></div></aside></div>`}${footer()}</main>`;
  }
  function control(s) {
    const o=selected(s);
    return `<header class="sp-control-top">${brand()}<nav class="sp-control-nav" aria-label="Main navigation"><button class="cursor-interaction" data-page="orders" ${s.page==='orders'?'aria-current="page"':''}>Operations</button><button class="cursor-interaction" data-page="lab" ${s.page==='lab'?'aria-current="page"':''}>Verification lab</button></nav><span class="sp-pill">${icon('hexagon')}Sepolia</span></header><main class="sp-control-main"><div class="sp-row sp-between sp-wrap">${preview()}${mode(s)}</div>${s.page==='lab'?lab(s):`<div class="sp-control-head"><div><div class="sp-overline">Supplier monitoring</div><h1 style="margin-top:10px">Know why money moves.</h1></div><span class="sp-pill sp-wait">${icon('clock-3')}2 checks needed</span></div><div class="sp-control-stats"><div><div class="sp-overline">Escrow remaining</div><div class="sp-metric">3,500</div><div class="sp-small sp-muted">Demo units across open orders</div></div><div><div class="sp-overline">Open / total</div><div class="sp-metric">2 <small>/ 5</small></div><div class="sp-small sp-muted">3 orders refunded</div></div><div><div class="sp-overline">Registries</div><div class="sp-metric">2</div><div class="sp-small sp-muted">Companies House + GLEIF</div></div></div><div class="sp-control-grid"><section>${s.mode==='complex'?`<div class="sp-row sp-between sp-wrap" style="margin-bottom:14px"><h2>Order monitor</h2>${filters(s)}</div><div class="sp-sheet">${table(s)}</div><div class="sp-sheet sp-padding" style="margin-top:18px"><div class="sp-row sp-between"><h3>Evidence / ${o.ref}</h3><span class="sp-pill">${o.source}</span></div><pre class="sp-code" style="margin-top:12px">${o.raw}</pre><div class="sp-row sp-between sp-wrap" style="margin-top:13px"><span class="sp-small sp-muted">${o.registry} · ${o.supplier}</span>${badge(o)}</div></div>`:`<div class="sp-row sp-between" style="margin-bottom:14px"><h2>Next decisions</h2><span class="sp-mono">02 pending</span></div>${orders.filter(x=>!x.closed).map(x=>`<article class="sp-task ${x.id===s.order?'sp-focus':''}"><div class="sp-row sp-between"><span class="sp-task-number">${x.ref} / ${x.source}</span>${icon('radar')}</div><h2>${x.name}</h2><p class="sp-small sp-muted">${x.detail}</p><div class="sp-path"><span>${icon('check')}Buyer approved</span>${icon('arrow-right')}<span>${icon('clock-3')}Fresh record needed</span></div><div class="sp-row sp-between"><span class="sp-small"><strong>${money(x.remaining)}</strong> still in escrow</span><button class="sp-button cursor-interaction" data-order="${x.id}">Inspect ${icon('arrow-up-right')}</button></div></article>`).join('')}<p class="sp-small sp-muted" style="margin-top:14px">Three orders were closed after refunds to the buyer.</p>`}</section><aside>${o.closed?details(o):checks()}<div class="sp-sheet sp-padding" style="margin-top:16px"><div class="sp-row sp-between"><h3>Agent policy</h3>${icon('bot')}</div>${kv([['Profile','Demo'],['Tick interval','30 seconds'],['Max fetches / tick','3'],['History tier',o.tier]])}<p class="sp-small sp-muted" style="margin-top:12px">Configuration example, not a live agent heartbeat.</p></div>${s.mode==='complex'?`<div style="margin-top:16px">${eventLog(o)}</div>`:''}</aside></div>`}${footer()}</main>`;
  }
  function hybrid(s) {
    const o=selected(s);
    const complex=s.mode==='complex';
    const summary=`<div class="sp-ledger-summary"><div><div class="sp-overline">Remaining in escrow</div><div class="sp-metric">3,500</div><div class="sp-small sp-muted">demo units · 2 open orders</div></div><div><div class="sp-overline">Paid to suppliers</div><div class="sp-summary-minor">1,000</div><div class="sp-small sp-muted">2 milestones</div></div><div><div class="sp-overline">Returned to buyer</div><div class="sp-summary-minor">5,000</div><div class="sp-small sp-muted">3 refunded orders</div></div></div>`;
    const choices=orders.map(x=>`<button class="sp-order-choice cursor-interaction" data-order="${x.id}" aria-pressed="${x.id===s.order}"><div class="sp-choice-title"><div><strong>${x.name}</strong><span class="sp-small sp-muted">${x.ref} · ${x.registry}</span></div><span class="sp-amount">${money(x.remaining)}</span></div><div class="sp-choice-bottom">${badge(x)}${icon('arrow-up-right')}</div></button>`).join('');
    const rail=`<aside class="sp-hybrid-rail"><div class="sp-sheet sp-padding"><div class="sp-overline">Selected order / ${o.ref}</div><h2 style="margin-top:8px">${o.name}</h2><p class="sp-small sp-muted" style="margin-top:4px">${o.registry} · ${o.supplier}</p><div class="sp-rule"></div><div class="sp-row sp-between"><span class="sp-small sp-muted">${o.closed?'Returned to buyer':'Next milestone'}</span><span style="font-size:25px">${money(o.closed?o.total-o.paid:o.next)}</span></div><p class="sp-small sp-muted" style="margin-top:9px">${o.detail}</p></div><div style="margin-top:14px">${o.closed?`<div class="sp-note">${icon('rotate-ccw')}<div><strong>Refund complete</strong><p class="sp-small">No further milestones can be released.</p></div></div>`:checks()}</div>${complex?`<details class="sp-sheet sp-padding" style="margin-top:14px"><summary class="cursor-interaction">Agent &amp; permit policy</summary>${kv([['Profile','Demo configuration'],['Tick / max fetches','30 s / 3'],['Submission max age','300 s'],['Permit lifetime','1,800 s'],['History tier',o.tier]])}<p class="sp-small sp-muted">Configuration example; history changes checking cadence, not payment eligibility.</p></details>`:`<button class="sp-button sp-quiet cursor-interaction" data-mode="complex" style="margin-top:16px">See evidence &amp; agent details ${icon('arrow-right')}</button>`}</aside>`;
    return `<aside class="sp-ledger-side">${brand()}<nav class="sp-side-nav" aria-label="Main navigation"><button class="cursor-interaction" data-page="orders" ${s.page==='orders'?'aria-current="page"':''}>${icon('layout-dashboard')}Payments</button><button class="cursor-interaction" data-page="lab" ${s.page==='lab'?'aria-current="page"':''}>${icon('shield-check')}Verification lab</button></nav><div class="sp-side-foot"><div class="sp-overline">Workspace</div><div class="sp-row" style="margin-top:12px"><span class="sp-avatar">PP</span><span>Powerpuffgirls<br>Demo workspace</span></div></div></aside><main class="sp-ledger-main"><div class="sp-row sp-between sp-wrap">${preview()}${mode(s)}</div>${s.page==='lab'?lab(s):`<header class="sp-hybrid-hero"><div class="sp-overline">Payments / Decision workspace</div><h1 style="margin:10px 0">Clear payments.<br>Visible decisions.</h1><div class="sp-row sp-between sp-wrap"><p class="sp-muted">Your funds at a glance. The reason behind every release.</p><span class="sp-pill sp-wait">${icon('clock-3')}2 checks needed</span></div></header>${summary}<div class="sp-hybrid-work"><section><div class="sp-row sp-between sp-wrap" style="margin-bottom:14px"><h2>${complex?'Order monitor':'Your orders'}</h2>${complex?filters(s):'<span class="sp-small sp-muted">5 orders</span>'}</div>${complex?`<div class="sp-sheet">${table(s)}</div><div style="margin-top:16px">${proof(o)}</div><div style="margin-top:14px">${eventLog(o)}</div>`:choices}</section>${rail}</div>`}${footer()}</main>`;
  }
  const renderers={ledger,control,hybrid};
  function save() {
    if(window.openai && window.openai.setWidgetState) {
      const content=Object.fromEntries(Object.entries(states).map(([key,s])=>[key,{mode:s.mode,page:s.page,order:s.order,test:s.test,filter:s.filter}]));
      window.openai.setWidgetState({modelContent:{supplierpulseSelectedConcepts:content},privateContent:null}).catch(()=>{});
    }
  }
  function render(key) {
    const app=document.getElementById('sp-'+key);
    app.innerHTML=renderers[key](states[key]);
    app.querySelectorAll('button').forEach(b=>{b.type='button';});
    if(window.lucide) window.lucide.createIcons({attrs:{width:16,height:16}});
  }
  const saved=window.openai && window.openai.widgetState && window.openai.widgetState.modelContent && window.openai.widgetState.modelContent.supplierpulseSelectedConcepts;
  Object.keys(renderers).forEach(key=>{
    const prior=saved && saved[key];
    states[key]={mode:prior&&prior.mode==='complex'?'complex':'simple',page:prior&&prior.page==='lab'?'lab':'orders',order:prior&&orders.some(o=>o.id===prior.order)?prior.order:0,test:prior&&cases.some(c=>c.key===prior.test)?prior.test:'valid',filter:prior&&['all','open','closed'].includes(prior.filter)?prior.filter:'all'};
    render(key);
    const app=document.getElementById('sp-'+key);
    app.addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b||b.disabled)return;
      const s=states[key];let changed=true;
      if(b.dataset.mode){s.mode=b.dataset.mode;s.filter='all';if(s.mode==='simple'&&s.test==='replay')s.test='valid';}
      else if(b.dataset.page){s.page=b.dataset.page;}
      else if(b.dataset.order!==undefined){s.order=Number(b.dataset.order);s.page='orders';}
      else if(b.dataset.filter){s.filter=b.dataset.filter;}
      else if(b.dataset.case){s.test=b.dataset.case;}
      else changed=false;
      if(changed){render(key);save();}
    });
    if(globalThis.Tweak){
      const style={appearance:'inherit',radius:12};
      const tweak=new Tweak({container:app,onChange:()=>{app.style.colorScheme=style.appearance;app.style.setProperty('--sp-radius',style.radius+'px');}});
      tweak.addSelect(style,'appearance',{label:'Görünüm',options:[{label:'Sistem',value:'inherit'},{label:'Açık',value:'light'},{label:'Koyu',value:'dark'}]});
      tweak.addSlider(style,'radius',{label:'Köşe yumuşaklığı',min:2,max:18,step:2,unit:'px'});
    }
  });
  window.addEventListener('openai:set_globals',event=>{
    const incoming=event.detail&&event.detail.globals&&event.detail.globals.widgetState&&event.detail.globals.widgetState.modelContent&&event.detail.globals.widgetState.modelContent.supplierpulseSelectedConcepts;
    if(!incoming)return;
    Object.keys(states).forEach(key=>{
      const next=incoming[key];if(!next)return;
      const s=states[key];s.mode=next.mode==='complex'?'complex':'simple';s.page=next.page==='lab'?'lab':'orders';
      s.order=orders.some(o=>o.id===next.order)?next.order:0;s.test=cases.some(c=>c.key===next.test)?next.test:'valid';s.filter=['all','open','closed'].includes(next.filter)?next.filter:'all';render(key);
    });
  });
})();
</script>
