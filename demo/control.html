<style>
#supplierpulse-selected-ui-concepts { width:100%; }
#supplierpulse-selected-ui-concepts .sp-app { --sp-page:light-dark(#f7f7f3,#15191e); --sp-panel:light-dark(#ffffff,#1c2229); --sp-subtle:light-dark(#efefea,#232a32); --sp-ink:light-dark(#222b32,#eff1f2); --sp-muted:light-dark(#626b72,#a8b2bd); --sp-line:light-dark(#dedfd8,#343d47); --sp-accent:light-dark(#344b70,#afc4ed); --sp-on-accent:light-dark(#fff,#17243b); --sp-accent-bg:light-dark(#eaf0f8,#273448); --sp-good:light-dark(#2b6651,#a9d7b8); --sp-good-bg:light-dark(#e8f2eb,#253c32); --sp-warn:light-dark(#885720,#ebc18a); --sp-warn-bg:light-dark(#faf0dd,#423627); --sp-red:light-dark(#9d453d,#f1b1a4); --sp-red-bg:light-dark(#f8ece8,#462e2d); --sp-radius:12px; --sp-space:26px; color:var(--sp-ink); background:var(--sp-page); border:1px solid var(--sp-line); border-radius:16px; font:400 13px/1.5 'DM Sans',sans-serif; overflow:clip; }

#supplierpulse-selected-ui-concepts .sp-app button,#supplierpulse-selected-ui-concepts .sp-app input,#supplierpulse-selected-ui-concepts .sp-app select,#supplierpulse-selected-ui-concepts .sp-app textarea { font:inherit; }

#supplierpulse-selected-ui-concepts .sp-app h1,#supplierpulse-selected-ui-concepts .sp-app h2,#supplierpulse-selected-ui-concepts .sp-app h3,#supplierpulse-selected-ui-concepts .sp-app p { margin:0; }
#supplierpulse-selected-ui-concepts .sp-app h1 { font-size:34px; line-height:1.12; font-weight:500; letter-spacing:-1.2px; }

#supplierpulse-selected-ui-concepts .sp-muted { color:var(--sp-muted); }
#supplierpulse-selected-ui-concepts .sp-small { font-size:11px; }

#supplierpulse-selected-ui-concepts .sp-pill { display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:5px; color:var(--sp-muted); background:var(--sp-subtle); font-size:11px; font-weight:500; white-space:nowrap; }

#supplierpulse-selected-ui-concepts .sp-padding { padding:20px; }
#supplierpulse-selected-ui-concepts .sp-rule { height:1px; background:var(--sp-line); margin:18px 0; }
#supplierpulse-selected-ui-concepts .sp-list { display:grid; }

#supplierpulse-selected-ui-concepts .sp-kv div:last-child { border:0; }
#supplierpulse-selected-ui-concepts .sp-kv dt { color:var(--sp-muted); }
#supplierpulse-selected-ui-concepts .sp-kv dd { margin:0; text-align:right; overflow-wrap:anywhere; max-width:210px; }
#supplierpulse-selected-ui-concepts .sp-filters { display:flex; gap:5px; flex-wrap:wrap; }
#supplierpulse-selected-ui-concepts .sp-filters button { border:0; background:transparent; padding:5px 9px; border-radius:5px; color:var(--sp-muted); font-size:11px; }
#supplierpulse-selected-ui-concepts .sp-filters button[aria-pressed=true] { background:var(--sp-accent-bg); color:var(--sp-ink); }
#supplierpulse-selected-ui-concepts .sp-table-wrap { overflow-x:auto; }
#supplierpulse-selected-ui-concepts .sp-table { width:100%; border-collapse:collapse; text-align:left; }

#supplierpulse-selected-ui-concepts .sp-table td { padding:13px 14px; border-bottom:1px solid var(--sp-line); font-size:12px; }

#supplierpulse-selected-ui-concepts .sp-footer .sp-row { gap:5px; }

/* Ledger: an editorial finance workspace with an enduring side rail. */

#supplierpulse-selected-ui-concepts .sp-choice-title .sp-amount { font-size:16px; letter-spacing:-.5px; white-space:nowrap; }
#supplierpulse-selected-ui-concepts .sp-choice-bottom { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }

/* Control Room: a horizontal, precision-first operations desk. */
#supplierpulse-selected-ui-concepts .sp-control { --sp-page:light-dark(#edf0eb,#111714); --sp-panel:light-dark(#f9fbf8,#18211b); --sp-subtle:light-dark(#e5ebe1,#202c23); --sp-ink:light-dark(#203025,#edf3e9); --sp-muted:light-dark(#596c5d,#9eafa1); --sp-line:light-dark(#cdd7ca,#344337); --sp-accent:light-dark(#345a35,#d0e8a0); --sp-on-accent:light-dark(#fff,#20301b); --sp-accent-bg:light-dark(#e1ebd8,#2c3c25); font-family:'Manrope',sans-serif; }
#supplierpulse-selected-ui-concepts .sp-control-top { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:19px var(--sp-space); border-bottom:1px solid var(--sp-line); background:var(--sp-panel); }

#supplierpulse-selected-ui-concepts .sp-doc-choice small { display:block; color:var(--sp-muted); font-size:11px; margin-top:4px; }
#supplierpulse-selected-ui-concepts .sp-agreement-main { padding:25px var(--sp-space); min-width:0; }
#supplierpulse-selected-ui-concepts .sp-agreement h1 { font:400 39px/1.08 'Instrument Serif',serif; letter-spacing:-.7px; }
#supplierpulse-selected-ui-concepts .sp-paper { --sp-paper:light-dark(#fffdf6,#e9e0cd); --sp-paper-ink:#3d3930; background:var(--sp-paper); color:var(--sp-paper-ink); padding:28px; border-radius:3px; box-shadow:0 5px 20px #0000000b; margin:22px 0; border-top:3px solid var(--sp-accent); }

<script>
// Control Room for SupplierPulse: Orhun's design (design/ui-concepts, codex/ui-design-concepts) with the project's real
// data and actions. The markup and styles are the design's own; the values come from the live contract (or sample mode)
// through the same view functions and events as index.html, and the Verification lab runs the real tamper test
// (eth_call of submitEvidence from 0x…dEaD, as judge.html). Screens: Operations, Verification lab, Agent, Judge kit,
// Settings, each in the design's horizontal navigation. Writes only on a press: Release or Refund (the contract decides)
// and Replay (sends the valid record once).
(() => {
  const P = window.PULSE;
  const { esc, short, nowSec } = P;
  const app = document.getElementById('sp-control');
  const icon = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const UNIT = 10n ** 12n; // 1 token = 10^12 wei (§2.5)
  const money = (wei) => P.tokens(wei, UNIT);
  const params = new URLSearchParams(location.search);
  const link = { contract: params.get('contract'), rpc: params.get('rpc'), from: params.get('from') };

  const ignored = [['contract', link.contract && !cfg.contract], ['rpc', link.rpc && cfg.rpc !== link.rpc], ['from', link.from && !cfg.from]].filter(([, bad]) => bad).map(([k]) => k);
  const MAX_ORDERS = 50; // the newest orders only: anyone can create orders, and a malicious contract can claim any count

  const LOCAL = {

  const FIXTURES = {
    old: { 'ch:03778796': 'ch-03778796-202610301614.json', 'ch:07418033': 'ch-07418033-202610301614.json', 'ch:09729896': 'ch-09729896-202610301614.json',
      'gleif:391200JI69LS8L648F30': 'gleif-391200JI69LS8L648F30-202610301607.json', 'gleif:52990092KBQJF8QBGJ50': 'gleif-52990092KBQJF8QBGJ50-202610301607.json' },
    other: { ch: ['ch-07418033-202610301910.json', 'ch-03778796-202610301910.json'], gleif: ['gleif-52990092KBQJF8QBGJ50-202610301607.json', 'gleif-391200JI69LS8L648F30-202610301910.json'] },
  };

  // The seven most frequent of his eleven scenarios (user request: less content); the rest stay in his document.
  const FAQ = [
    ['Fresh signed evidence passes the buyer’s rules', 'Pay only the approved, due milestone amount. Show the registry, fields checked, evidence time, and transaction.', 'Every payment has its own verifiable basis; approval does not exceed the agreed stage.'],
    ['Buyer has not approved the milestone', 'Do not pay, even if the registry check passes.', 'Registry status is not treated as proof of delivery or buyer acceptance.'],
    ['Fresh signed evidence fails a configured rule', 'Hold the order; explain exactly which rule failed. Let the buyer claim the remaining escrow immediately. Do not label the supplier fraudulent.', 'A rule-based hold is visible and actionable without making claims beyond the evidence.'],
    ['Signature, supplier, request, timestamp, or replay check fails', 'Reject that record and do not pay against it. Log the rejection reason and seek fresh evidence. A bad submission alone should not automatically move funds.', 'Invalid evidence cannot force a refund; rejection is not evidence that the supplier failed.'],
    ['Registry/API data is unavailable or incomplete', 'Report “no verified data,” not “supplier failed.” Do not pay without a valid permit. Retry within the spending policy; if data remains unavailable through the agreed grace period, refund the remaining escrow.', 'Separates a service/data outage from an adverse supplier finding.'],

    'SupplierPulse checks configured registry conditions. A signed registry response proves what the source returned, not that the data is complete, current in the real world, or proof of delivery or future performance.',
  ];
  const nameOf = P.orderNamer();

  // ---------------------------------------------------------------- data: one order model for sample and live

  let provider = null, contract = null, iface = new ethers.Interface(P.ABI), chainId = null, explorer = null, consts = null, agentAddr = '';
  let orders = null, readAt = 0, readFailed = '', mode = 'live';
  const evState = { next: null, list: [], blockTime: {}, txFrom: {} };

  function norm(o) {
    const i = o.info, m = o.milestones, s = o.status, h = o.schedule, r = o.supplier;
    const source = Number(i.source);
    const label = nameOf(i.orderRef, i.supplierId) || `Order ${short(i.orderRef)}`;
    const split = label.match(/^([A-Z]+-\d+)\s+(.+)$/);

      id: Number(o.id), ref: split ? split[1] : `#${o.id}`, name: split ? split[2] : label,
      registry: source === 1 ? 'GLEIF' : 'Companies House', source: source === 1 ? 'LEI' : 'CH', sourceIndex: source, key: source === 1 ? 'gleif' : 'ch',

      amounts, total: amounts.reduce((a, b) => a + b, 0n), dueDates: [...m.dueDates].map(Number), approved: [...m.approved].map(Boolean),

      lastFailedRules: Number(h.lastFailedRules), heldAt: Number(h.heldAt), autoRefundAt: Number(h.autoRefundAt),
      tier: Number(r.tier), lastBaseFailureAt: Number(r.lastBaseFailureAt), events: o.events || [],

  }

  async function loadEvents(latest) {
    let from = evState.next;
    if (from === null) { // first read: the deploy block if given, else the last 9000 blocks; at most ~270k blocks
      from = cfg.from ? Number(cfg.from) : Math.max(0, latest - LOG_CHUNK);
    }
    from = Math.max(from, latest - LOG_CHUNK * MAX_CHUNKS);
    while (from <= latest) {
      const to = Math.min(latest, from + LOG_CHUNK - 1);
      const logs = await provider.getLogs({ address: cfg.contract, fromBlock: from, toBlock: to });
      for (const log of logs) {
        let ev; try { ev = iface.parseLog(log); } catch { continue; }
        if (!ev) continue;
        const args = {}; ev.fragment.inputs.forEach((inp, k) => { args[inp.name] = ev.args[k]; });
        evState.list.push({ name: ev.name, args, block: log.blockNumber, tx: log.transactionHash, logIndex: log.index });
      }
      from = to + 1;
    }
    evState.next = latest + 1;
    const txs = {};
    for (const e of evState.list) (txs[e.tx] ||= []).push(e);
    const lookups = [];
    for (const [tx, evs] of Object.entries(txs)) {
      if (evState.txFrom[tx]) continue;
      const ea = evs.find((e) => e.name === 'EvidenceAccepted'), rf = evs.find((e) => e.name === 'OrderRefunded'), oc = evs.find((e) => e.name === 'OrderCreated');
      if (ea) evState.txFrom[tx] = ea.args.submitter; else if (rf) evState.txFrom[tx] = rf.args.triggeredBy; else if (oc) evState.txFrom[tx] = oc.args.buyer;
      else lookups.push(tx);
    }
    await Promise.all(lookups.slice(0, 40).map(async (tx) => { try { const t = await provider.getTransaction(tx); if (t) evState.txFrom[tx] = t.from; } catch { /* unknown */ } }));
    const blocks = [...new Set(evState.list.map((e) => e.block))].filter((b) => !(b in evState.blockTime)).slice(-80);
    await Promise.all(blocks.map(async (b) => { try { const blk = await provider.getBlock(b); if (blk) evState.blockTime[b] = blk.timestamp; } catch { /* unknown */ } }));
    for (const e of evState.list) { e.time = evState.blockTime[e.block]; e.from = evState.txFrom[e.tx]; }
  }
  function eventsByOrder() {
    const by = {}, orderOfTx = {};
    for (const e of evState.list) if (e.args.orderId !== undefined) { const id = Number(e.args.orderId); (by[id] ||= []).push(e); orderOfTx[e.tx] = id; }
    for (const e of evState.list) if (e.name === 'TierChanged' && orderOfTx[e.tx] !== undefined) by[orderOfTx[e.tx]].push(e);
    return by;
  }

  async function loadLive() {
    if (!consts) {
      provider = new ethers.JsonRpcProvider(cfg.rpc, undefined, { staticNetwork: true });
      chainId = Number((await provider.getNetwork()).chainId);
      explorer = P.EXPLORERS[chainId] || null;
      if (!cfg.contract) {
        const found = await P.discoverV2(provider);
        if (!found) throw new Error('No SupplierPulse contract found on this network. Enter its address in Settings.');
        cfg.contract = found;
      }
      if ((await provider.getCode(cfg.contract)) === '0x') throw new Error(`no contract at ${cfg.contract} on chain ${chainId}`);
      contract = new ethers.Contract(cfg.contract, P.ABI, provider);
      agentAddr = P.DEFAULT_AGENT[chainId] || '';
      const [ch, gl, maxAge, grace] = await Promise.all([contract.airnodeOf(0), contract.airnodeOf(1), contract.maxAge(), contract.refundGrace()]);
      consts = { airnodes: [ch, gl], maxAge: Number(maxAge), refundGrace: Number(grace) };

    }));

  }
  function loadSample() {

  }

  // ---------------------------------------------------------------- what each order means now (one place)

  const permitValid = (o) => o.permitValidRead && nowSec() <= o.permitValidUntil;

  const refunded = (o) => closed(o) && o.paid < o.total;

  const noData = (o) => o.state === 0 && o.autoRefundAt > 0 && nowSec() >= o.dueDates[o.next];

  const causeOf = (o) => o.lastBaseFailureAt ? orders.find((x) => sameSupplier(x, o) && x.events.some((e) => e.name === 'EvidenceAccepted' && !e.args.clean && (Number(e.args.failedRules) & P.BASE_FAILED) && Number(e.args.timestamp) === o.lastBaseFailureAt)) : null;

  function status(o) {

  // ---------------------------------------------------------------- the design's components, with the real values

  const PAGES = [['orders', 'Operations'], ['lab', 'Verification lab'], ['agent', 'Agent'], ['kit', 'Judge kit'], ['settings', 'Settings']];

  const dark = () => document.documentElement.dataset.theme === 'dark';
  const top = () => `<header class="sp-control-top">${brand()}<nav class="sp-control-nav" aria-label="Main navigation">${PAGES.map(([k, l]) => `<button class="cursor-interaction" data-page="${k}" ${s.page === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav><div class="sp-row" style="gap:8px"><button class="sp-pill sp-guide cursor-interaction" data-theme-toggle aria-pressed="${dark()}">${icon('moon')}Dark</button><button class="sp-pill sp-guide cursor-interaction" data-guide aria-label="Guide: a short walk through the Control Room">${icon('circle-help')}Guide</button><span class="sp-pill">${icon('hexagon')}${network()}</span></div></header>`;
  const preview = () => ignored.length ? `<span class="sp-preview">${icon('shield-alert')}Ignored an invalid ${ignored.join(', ')} in the link</span>` : mode === 'sample'

  const footer = () => `<footer class="sp-footer"><span class="sp-row">${icon('hexagon')}${mode === 'sample' ? 'Sample data' : esc(P.NETWORKS[chainId] || (chainId ? `Chain ${chainId} (unknown network)` : 'Connecting'))} · tokens (1 token = 10¹² wei)</span><span>${mode === 'sample' ? 'Nothing can be sent in sample mode' : 'Read-only until you press Release, Refund or Replay'}</span></footer>`;
  const kv = (pairs) => `<dl class="sp-kv">${pairs.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>`;
  const heading = (over, title, sub) => `<div class="sp-lab-heading"><div class="sp-overline">${over}</div><h1 style="margin-top:10px">${title}</h1><p class="sp-muted" style="margin-top:9px">${sub}</p></div>`;
  const orderChips = () => `<div class="sp-filters" role="group" aria-label="Order" style="margin:-8px 0 20px">${orders.map((x) => `<button class="cursor-interaction" data-pick="${x.id}" aria-pressed="${x.id === s.order}">${esc(x.ref)}</button>`).join('')}</div>`;
  const copyBtn = (text) => `<button class="sp-button sp-quiet cursor-interaction" data-copy="${esc(text)}">${icon('copy')}Copy</button>`;
  const code = (text) => `<pre class="sp-code" style="margin-top:12px">${esc(text)}</pre><div class="sp-row" style="justify-content:flex-end;margin-top:6px">${copyBtn(text)}</div>`;
  const inFilter = (o) => s.filter === 'all' || (s.filter === 'closed' ? refunded(o) : !closed(o));
  const filters = () => `<div class="sp-filters" role="group" aria-label="Filter orders">${[['all', 'All orders'], ['open', 'Open'], ['closed', 'Refunded']].map(([k, l]) => `<button class="cursor-interaction" data-filter="${k}" aria-pressed="${s.filter === k}">${l}</button>`).join('')}</div>`;
  const table = () => `<div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>Order</th><th>Registry</th><th>Status</th><th class="sp-num">Remaining</th></tr></thead><tbody>${orders.filter(inFilter).map((o) => `<tr data-selected="${o.id === s.order}"><td><button class="cursor-interaction" data-order="${o.id}" aria-label="Open ${esc(o.name)}">${esc(o.name)}</button><div class="sp-muted sp-small">${esc(o.ref)}</div></td><td class="sp-muted">${o.source}</td><td>${badge(o)}</td><td class="sp-num">${money(closed(o) ? 0n : o.remaining)}</td></tr>`).join('') || `<tr><td colspan="4" class="sp-muted">No orders in this filter.</td></tr>`}</tbody></table></div>`;
  function milestone(o) {
    return o.amounts.map((amount, i) => {
      const paid = i < o.next || (closed(o) && !refunded(o));
      const cur = !closed(o) && i === o.next;
      const text = paid ? 'Paid to supplier' : refunded(o) ? 'Closed · refunded to buyer' : cur ? `${o.approved[i] ? 'Buyer approved' : 'Awaiting buyer approval'} · ${permitValid(o) ? 'permit valid' : 'awaiting fresh check'} · due ${dayClock(o.dueDates[i])}` : `Upcoming · due ${dayClock(o.dueDates[i])}`;
      return `<div class="sp-step"><span class="sp-step-icon ${paid ? 'sp-done' : cur ? 'sp-alert' : ''}">${icon(paid ? 'check' : refunded(o) ? 'minus' : 'clock-3')}</span><div style="flex:1"><div class="sp-row sp-between"><span>Milestone ${i + 1}</span><strong>${money(amount)}</strong></div><div class="sp-small sp-muted">${text}</div></div></div>`;

  let sendMsg = { id: null, html: '' };
  const sendLine = (o) => (sendMsg.id === o.id && sendMsg.html ? `<p class="sp-small" style="margin-top:12px" role="status">${sendMsg.html}</p>` : '');
  const details = (o, complex = false) => `<div class="sp-sheet sp-padding"><div class="sp-row sp-between"><h3>${esc(o.ref)}</h3>${icon('file-check-2')}</div><h2 style="margin-top:8px">${esc(o.name)}</h2><p class="sp-small sp-muted" style="margin:5px 0 18px">${o.registry} · ${esc(o.supplier)}</p><div class="sp-overline">${refunded(o) ? 'Returned to buyer' : closed(o) ? 'Paid to supplier' : 'Next milestone'}</div><div style="font-size:32px;letter-spacing:-1px;margin:5px 0 12px">${money(refunded(o) ? o.total - o.paid : closed(o) ? o.paid : o.amounts[o.next])} <span class="sp-small sp-muted" style="letter-spacing:0">tokens</span></div>${notice(o)}${complex ? `<details class="sp-disclosure" data-key="ms-${o.id}"${opened('ms-' + o.id)}><summary class="cursor-interaction">Milestones and policy</summary>${milestone(o)}${kv([['Permit', closed(o) ? 'None · order closed' : permitValid(o) ? `Valid until ${dayClock(o.permitValidUntil)}` : o.permitValidUntil ? 'Expired' : 'None yet'], ['Submission max age', `${consts.maxAge} seconds`], ['Permit lifetime', `${o.permitTtl.toLocaleString('en-GB')} seconds`], ['History tier', tierName(o.tier)]])}</details>` : `<button class="sp-button sp-quiet cursor-interaction" data-mode="complex" style="margin-top:13px">Review milestones ${icon('arrow-right')}</button>`}${sendLine(o)}</div>`;

  // Release conditions: the four facts the contract checks, from this order's own reads; one action at the bottom
  function action(o) {
    const due = o.dueDates[o.next];
    if (mode === 'sample') return { label: 'Payment unavailable', icon: 'lock-keyhole', why: 'Sample data: nothing can be sent.' };
    if (o.state === 1) {
      const open = nowSec() >= o.autoRefundAt;
      return { fn: 'refundRemaining', label: 'Refund to buyer', icon: 'rotate-ccw', why: open ? 'Anyone can send the rest back to the buyer now.' : `The buyer can refund now; anyone ${when(o.autoRefundAt)}.` };
    }
    if (noData(o)) {
      const open = nowSec() >= o.autoRefundAt;
      return { fn: open ? 'refundRemaining' : null, label: 'Refund to buyer', icon: 'rotate-ccw', why: open ? 'No verified data: anyone can return the funds to the buyer now.' : `No verified data: anyone can return the funds ${when(o.autoRefundAt)}.` };
    }
    if (stopped(o)) return { label: 'Payment unavailable', icon: 'lock-keyhole', why: 'The supplier is stopped by a newer failed registry status.' };
    const missing = [];
    if (!o.approved[o.next]) missing.push("the buyer's approval");
    if (!permitValid(o)) missing.push('a valid payment permit');
    if (nowSec() < due) missing.push(`the due date (in ${span(due - nowSec())})`);
    if (missing.length) return { label: 'Payment unavailable', icon: 'lock-keyhole', why: `Needs ${missing.join(', ')}.` };
    return { fn: 'release', label: `Release milestone ${o.next + 1}`, icon: 'send', why: `Pays ${money(o.amounts[o.next])} tokens to the supplier ${short(o.payee)}.` };
  }
  // inline: inside the order's card in the Simple view (no frame, no order name); otherwise the side panel
  function checks(o, inline = false) {
    const due = o.dueDates[o.next];
    const rows = [
      [o.approved[o.next], o.approved[o.next] ? 'circle-check' : 'clock-3', 'Buyer approval', o.approved[o.next] ? 'Approved' : 'Not yet'],
      o.state === 1 || o.lastFailedRules ? [false, 'circle-x', 'Registry rules', 'Failed', 'sp-failed'] : o.lastCheck ? [true, 'circle-check', 'Registry rules', 'Last check passed'] : [false, 'clock-3', 'Registry rules', 'No record yet'],
      [permitValid(o), permitValid(o) ? 'circle-check' : 'clock-3', 'Payment permit', permitValid(o) ? `Valid until ${new Date(o.permitValidUntil * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}` : o.state === 1 ? 'Cleared by the hold' : o.permitValidUntil ? 'Expired' : 'None yet'],
      [nowSec() >= due, nowSec() >= due ? 'circle-check' : 'calendar-clock', 'Milestone due', nowSec() >= due ? 'Due now' : soon(due - nowSec())],
    ];
    const a = action(o);
    const busy = sendMsg.id === o.id && sendMsg.busy;
    // the supplier-wide stop, said where it acts: which order caused it, which other orders it stops, or that it is past
    const c = stopped(o) ? causeOf(o) : null, st = stopsOf(o);
    const stop = c && c.id !== o.id ? `<p class="sp-small sp-muted" style="margin-top:6px">Stopped by ${orderLink(c)}</p>` : '';
    const also = st.length ? `<p class="sp-small sp-muted" style="margin-top:6px">Also stops ${st.map(orderLink).join(' ')}</p>` : '';
    const past = pastFailure(o) ? `<p class="sp-small sp-muted" style="margin-top:6px">Earlier failure on record (${dayClock(o.lastBaseFailureAt)}); this order's evidence is newer, so it no longer blocks payment.</p>` : '';
    const sched = s.mode === 'complex' ? `<details class="sp-disclosure" data-key="sched-${o.id}"${opened('sched-' + o.id)}><summary class="cursor-interaction">Milestone schedule</summary>${milestone(o)}</details>` : '';
    return `<div class="${inline ? 'sp-inline-conditions' : 'sp-sheet sp-padding'} sp-conditions"><h3>Release conditions</h3>${inline ? '' : `<p class="sp-small sp-muted" style="margin-top:4px">${esc(o.ref)} · ${esc(o.name)}</p>`}<div style="margin-top:10px">${rows.map(([ok, ic, label, value, extra]) => `<div class="sp-check ${ok ? '' : extra || 'sp-expired'}">${icon(ic)}${label}<span>${value}</span></div>`).join('')}</div><button class="sp-button ${a.fn && !busy ? 'sp-primary' : ''} cursor-interaction" ${a.fn && !busy ? `data-act="${a.fn}"` : 'disabled'} style="width:100%;margin-top:12px">${icon(busy ? 'loader' : a.icon)}${busy ? 'Waiting for the wallet…' : a.label}</button><p class="sp-small sp-muted" style="margin-top:9px">${a.why}</p>${stop}${also}${past}${sendLine(o)}${sched}</div>`;
  }
  // the agent's own transactions, one row per transaction, newest first (sample events carry no hash: grouped by time)
  function agentRows() {
    const groups = new Map();
    for (const o of orders) for (const e of o.events) {
      if (!e.from || !agentAddr || e.from.toLowerCase() !== agentAddr.toLowerCase()) continue;
      const k = e.tx || `${o.id}:${e.time}`;
      if (!groups.has(k)) groups.set(k, { o, tx: e.tx, time: e.time || 0, block: e.block || 0, evs: [] });
      groups.get(k).evs.push(e);
    }
    return [...groups.values()].sort((a, b) => b.time - a.time || b.block - a.block);
  }
  function agentWords(g) {
    const o = g.o, parts = [];
    for (const e of g.evs) {
      const a = e.args;
      if (e.name === 'EvidenceAccepted') parts.push(a.clean ? 'Register check passed' : `Register check failed: ${P.failedLabels(o.sourceIndex, Number(a.failedRules)).join(', ')}`);
      else if (e.name === 'PermitIssued') parts.push(`payment permit for milestone ${Number(a.milestone) + 1}`);
      else if (e.name === 'MilestonePaid') parts.push(`paid milestone ${Number(a.milestone) + 1} (${money(a.amount)} tokens)`);
      else if (e.name === 'OrderHeld') parts.push('order held');
      else if (e.name === 'OrderRefunded') parts.push(`refunded ${money(a.amount)} tokens to the buyer`);
      else if (e.name === 'TierChanged') parts.push(`history tier ${tierName(Number(a.newTier))}`);
    }
    return parts.join(' → ') || g.evs.map((e) => e.name).join(', ');
  }
  function agentLast() {
    if (mode === 'sample') return 'Sample data: no live agent.';
    const rows = agentRows();
    if (!rows.length || !rows[0].time) return 'No agent transaction in the loaded history: Unknown.';
    return `Configured settings; last on-chain action ${P.ago(nowSec() - rows[0].time)}.`;
  }
  const policy = (o) => `<div class="sp-sheet sp-padding sp-policy" style="margin-top:16px"><div class="sp-row sp-between"><h3>Agent policy</h3>${icon('bot')}</div>${kv([['Profile', AGENT_CONFIG.profile], ['Tick interval', AGENT_CONFIG.tick], ['Max fetches / tick', AGENT_CONFIG.fetches], ['History tier', tierName(o.tier)]])}<p class="sp-small sp-muted" style="margin-top:12px">${agentLast()}</p></div>`;
  function trailLine(e, o) {
    const a = e.args, at = e.time ? ` · ${dayClock(e.time)}` : '';
    switch (e.name) {
      case 'OrderCreated': return ['Buyer funded the order.', `${money(a.total)} tokens locked${at}.`];
      case 'MilestoneApproved': return [`Buyer approved milestone ${Number(a.milestone) + 1}.`, at.slice(3)];
      case 'EvidenceAccepted': return [a.clean ? 'Airnode record accepted.' : 'Airnode record accepted: rules failed.', `${a.clean ? 'Every rule passes' : esc(P.failedLabels(o.sourceIndex, Number(a.failedRules)).join(', ') || 'failed')}${at}.`];
      case 'PermitIssued': return [`Payment permit for milestone ${Number(a.milestone) + 1}.`, `Valid until ${dayClock(Number(a.validUntil))}${at}.`];
      case 'MilestonePaid': return [`Milestone ${Number(a.milestone) + 1} paid.`, `${money(a.amount)} tokens released${at}.`];
      case 'OrderHeld': return ['Order held.', `${esc(P.failedLabels(o.sourceIndex, Number(a.failedRules)).join(', '))}${at}.`];
      case 'OrderRefunded': return ['Funds returned to buyer.', `${money(a.amount)} tokens${a.noDataExit ? ', no-data exit' : ''}${at}.`];
      case 'TierChanged': return [`History tier: ${tierName(Number(a.oldTier))} → ${tierName(Number(a.newTier))}.`, `Clean streak ${a.cleanStreak}${at}.`];
      default: return [e.name, at.slice(3)];
    }
  }
  const txLink = (h, label = 'tx') => (explorer && h ? ` <a class="sp-muted" href="${explorer}/tx/${h}" target="_blank" rel="noopener">${label}</a>` : '');
  const eventLog = (o) => { const evs = [...o.events].sort((x, y) => (x.time || 0) - (y.time || 0) || (x.block || 0) - (y.block || 0) || (x.logIndex || 0) - (y.logIndex || 0)); return `<details class="sp-sheet sp-padding" data-key="trail-${o.id}"${opened('trail-' + o.id)}><summary class="cursor-interaction">Decision trail</summary>${evs.length ? evs.map((e, k) => { const [t, d] = trailLine(e, o); return `<div class="sp-log-line"><span>${String(k + 1).padStart(2, '0')}</span><p>${t}<br><span class="sp-muted">${d}${txLink(e.tx)}</span></p></div>`; }).join('') : `<div class="sp-log-line"><span>00</span><p><span class="sp-muted">No events in the loaded history.</span></p></div>`}</details>`; };
  function evidence(o) {
    const e = lastEvidence(o);
    const raw = e ? pretty(rawOf(e)) : 'No signed record accepted for this order yet.';
    return `<div class="sp-sheet sp-padding" style="margin-top:18px"><div class="sp-row sp-between"><h3>Evidence / ${esc(o.ref)}</h3><span class="sp-pill">${o.source}</span></div><pre class="sp-code" style="margin-top:12px">${esc(raw)}</pre><div class="sp-row sp-between sp-wrap" style="margin-top:13px"><span class="sp-small sp-muted">${o.registry} · ${esc(o.supplier)}${e && e.args.timestamp ? ` · signed ${dayClock(Number(e.args.timestamp))}` : ''}</span>${badge(o)}</div></div>`;
  }
  function task(x) {
    const r = reason(x), st = status(x);
    const second = st.label === 'Fresh check needed' ? 'Fresh record needed' : st.label;
    const open = x.id === s.order && s.open; // Inspect opens the release conditions right here, under the button
    return `<article class="sp-task ${x.id === s.order ? 'sp-focus' : ''}"><div class="sp-row sp-between"><span class="sp-task-number">${esc(x.ref)} / ${x.source}</span>${icon('radar')}</div><h2>${esc(x.name)}</h2><p class="sp-small sp-muted">${esc(r.detail)}</p><div class="sp-path"><span>${icon(x.approved[x.next] ? 'check' : 'clock-3')}${x.approved[x.next] ? 'Buyer approved' : 'Awaiting approval'}</span>${icon('arrow-right')}<span>${icon(st.icon)}${second}</span></div><div class="sp-row sp-between"><span class="sp-small"><strong>${money(x.remaining)}</strong> still in escrow</span><button class="sp-button cursor-interaction" data-order="${x.id}" aria-expanded="${open}">${open ? 'Hide details' : 'Inspect'} ${icon(open ? 'chevron-up' : 'chevron-down')}</button></div>${open ? checks(x, true) : ''}</article>`;
  }

  // The FAQ on the home screen. Simple: one line per question, the answer on demand. Complex: the full table.
  function faq() {
    const limits = `<ul class="sp-faq-limits">${FAQ_LIMITS.map((x) => `<li>${x}</li>`).join('')}</ul>`;
    const head = `<div class="sp-row sp-between" style="margin:28px 0 14px"><h2>What happens when…</h2><span class="sp-mono">${String(FAQ.length).padStart(2, '0')} questions</span></div>`;
    if (s.mode === 'complex') {
      return `<section class="sp-faq-section" aria-labelledby="faq-h">${head.replace('<h2>', '<h2 id="faq-h">')}<div class="sp-sheet"><div class="sp-table-wrap"><table class="sp-table sp-faq-table"><thead><tr><th>Scenario</th><th>What the service does</th><th>Trust signal</th></tr></thead><tbody>${FAQ.map(([q, a, t]) => `<tr><td><strong style="font-weight:600">${q}</strong></td><td>${a}</td><td class="sp-muted">${t}</td></tr>`).join('')}</tbody></table></div></div><div class="sp-sheet sp-padding" style="margin-top:16px"><h3>Important limits</h3>${limits}</div></section>`;
    }
    return `<section class="sp-faq-section" aria-labelledby="faq-h">${head.replace('<h2>', '<h2 id="faq-h">')}<div class="sp-sheet sp-padding sp-faq">${FAQ.map(([q, a, t], i) => `<details class="sp-faq-item" data-key="faq-${i}"${opened('faq-' + i)}><summary class="cursor-interaction">${q}</summary><div class="sp-faq-body"><p>${a}</p><p class="sp-small sp-muted sp-row" style="margin-top:8px;align-items:flex-start">${icon('shield-check')}<span>${t}</span></p></div></details>`).join('')}<details class="sp-faq-item" data-key="faq-limits"${opened('faq-limits')}><summary class="cursor-interaction">Important limits</summary><div class="sp-faq-body">${limits}</div></details></div></section>`;
  }

  function operations(o) {
    const open = orders.filter((x) => !closed(x));
    const needs = open.filter((x) => x.state === 0 && !permitValid(x)).length;
    const nRefunded = orders.filter(refunded).length, nPaid = orders.filter((x) => closed(x) && !refunded(x)).length;
    const regs = [...new Set(orders.map((x) => x.registry))];

    return `<div class="sp-control-head"><div><div class="sp-overline">Supplier monitoring</div><h1 style="margin-top:10px">Supplier payments</h1></div>${needs ? `<span class="sp-pill sp-wait">${icon('clock-3')}${needs} check${needs === 1 ? '' : 's'} needed</span>` : `<span class="sp-pill sp-positive">${icon('circle-check')}No checks needed</span>`}</div><div class="sp-control-stats"><div><div class="sp-overline">Escrow remaining</div><div class="sp-metric">${money(escrow)}</div><div class="sp-small sp-muted">Tokens across open orders</div></div><div><div class="sp-overline">Open / total</div><div class="sp-metric">${open.length} <small>/ ${orders.length}</small></div><div class="sp-small sp-muted">${nRefunded} order${nRefunded === 1 ? '' : 's'} refunded</div></div><div><div class="sp-overline">Registries</div><div class="sp-metric">${regs.length}</div><div class="sp-small sp-muted">${regs.join(' + ') || 'None yet'}</div></div></div><div class="sp-control-grid"><section>${s.mode === 'complex' ? `<div class="sp-row sp-between sp-wrap" style="margin-bottom:14px"><h2>Order monitor</h2>${filters()}</div><div class="sp-sheet">${table()}</div>${evidence(o)}` : `<div class="sp-row sp-between" style="margin-bottom:14px"><h2>Next decisions</h2><span class="sp-mono">${String(open.length).padStart(2, '0')} pending</span></div>${open.map(task).join('') || `<p class="sp-small sp-muted">No open orders.</p>`}<p class="sp-small sp-muted" style="margin-top:14px">${nRefunded} order${nRefunded === 1 ? ' was' : 's were'} closed after refunds to the buyer${nPaid ? `; ${nPaid} ${nPaid === 1 ? 'was' : 'were'} fully paid` : ''}.</p>`}</section><aside>${closed(o) ? details(o, s.mode === 'complex') : s.mode === 'simple' ? '' : checks(o)}${policy(o)}${s.mode === 'complex' ? `<div style="margin-top:16px">${eventLog(o)}</div>` : ''}</aside></div>${faq()}`;
  }

  // ---------------------------------------------------------------- Agent: every transaction the agent sent, on its own

    const chips = `<div class="sp-filters" role="group" aria-label="Filter by order"><button class="cursor-interaction" data-aorder="all" aria-pressed="${s.agentOrder == null}">All orders</button>${orders.map((x) => `<button class="cursor-interaction" data-aorder="${x.id}" aria-pressed="${s.agentOrder === x.id}">${esc(x.ref)}</button>`).join('')}</div>`;
    return `${heading('Agent', 'Agent activity', 'What the agent did on chain, newest first. Nobody pressed a button for these.')}<div class="sp-control-grid"><section><div class="sp-row sp-between sp-wrap" style="margin-bottom:14px"><h2>Agent transactions</h2>${chips}</div><div class="sp-sheet"><div class="sp-table-wrap"><table class="sp-table"><thead><tr><th>When</th><th>Order</th><th>Action</th><th class="sp-num">Tx</th></tr></thead><tbody>${rows.map((g) => `<tr><td class="sp-muted" style="white-space:nowrap">${g.time ? dayClock(g.time) : `#${g.block}`}</td><td><button class="cursor-interaction" data-order="${g.o.id}">${esc(g.o.ref)}</button></td><td>${esc(agentWords(g))}</td><td class="sp-num">${txLink(g.tx, short(g.tx || '')) || '–'}</td></tr>`).join('') || `<tr><td colspan="4" class="sp-muted">${mode === 'sample' ? 'Sample data.' : 'No agent transaction for this filter.'}</td></tr>`}</tbody></table></div></div></section><aside>${policySheet}<div class="sp-sheet sp-padding" style="margin-top:16px"><h3>In the loaded history</h3>${kv([['Transactions', String(all.length)], ['Registry checks', String(kinds.checks)], ['Milestones paid', String(kinds.paid)], ['Orders held', String(kinds.held)], ['Refunds', String(kinds.refunded)], ['Data bought', `at least $${(kinds.checks * 0.01).toFixed(2)}`]])}<p class="sp-small sp-muted" style="margin-top:12px">Each accepted check is a signed record the agent bought for $0.01 over x402 on Base Sepolia; failed fetches are not on chain.${payments ? ` <a href="${payments}" target="_blank" rel="noopener">Every payment on BaseScan</a>.` : ''}</p></div></aside></div>`;

  // ---------------------------------------------------------------- Judge kit: everything to repeat the test outside the page

  function kitPage(o) {
    // every value pasted into a terminal is one single-quoted word; a supplier id appears only in the contract's format
    const q = P.shq, id = P.safeSupplierId(o.sourceIndex, o.supplier);
    const fetch = id ? `api3/scripts/fetch-evidence.sh ${o.key} ${q(id)} response.json` : '';

    const attacks = [`cd api3 && ${env}`, `scripts/plus-submit.sh ${o.id} response.json            # valid -> ACCEPTED`, `scripts/plus-submit.sh ${o.id} response.json value      # (a)   -> WrongSigner`, `scripts/plus-submit.sh ${o.id} response.json stale      # (b)   -> StaleResponse`, `scripts/plus-submit.sh ${o.id} response.json request    # (c)   -> WrongRequest`, `scripts/plus-submit.sh ${o.id} response.json key        # (d)   -> WrongSigner`, `scripts/plus-submit.sh ${o.id} response.json --send     # real tx; then again -> Replayed`].join('\n');
    const oldFx = id && FIXTURES.old[`${o.key}:${id}`], otherFx = id && (FIXTURES.other[o.key] || []).find((f) => !f.includes(id));
    const fixtures = chainId === 11155111 && (oldFx || otherFx) ? [`cd api3 && ${env}`, oldFx ? `scripts/plus-submit.sh ${o.id} fixtures/${oldFx}   # genuine, old -> StaleResponse` : '', otherFx ? `scripts/plus-submit.sh ${o.id} fixtures/${otherFx}   # genuine, other company -> WrongRequest` : ''].filter(Boolean).join('\n') : '';

  }

  // ---------------------------------------------------------------- Settings: what to watch, contract details, the other screens

  }

  // ---------------------------------------------------------------- Verification lab: the real tamper test on the selected order

  const cases = [
    { key: 'valid', mode: 'asis', name: 'Fresh, matching record', sub: 'Expected Airnode and request', expect: 'accepted', good: true },
    { key: 'value', mode: 'value', name: 'Edited value', sub: 'Original signature, changed data', expect: 'WrongSigner' },
    { key: 'old', mode: 'realOld', name: 'Genuine old record', sub: 'Untouched, signed earlier', expect: 'StaleResponse' },
    { key: 'request', mode: 'realOther', name: 'Other company', sub: 'Genuine different-request record', expect: 'WrongRequest' },
    { key: 'key', mode: 'key', name: 'Wrong signing key', sub: 'Signed by a different key', expect: 'WrongSigner' },
    { key: 'replay', mode: 'replay', name: 'Previously used record', sub: 'Sends the valid record once for real, then retries', expect: 'Replayed' },
  ];
  const WHY = {
    valid: 'A fresh clean record can issue a payment permit. Buyer approval and the due date still control release.',
    value: 'Changing a signed value changes the recovered signer. The record must be rejected.',
    old: 'The signed record is authentic but outside the accepted age window.',
    request: 'An authentic record for a different supplier cannot authorize this order.',
    key: 'Only the configured Airnode signer for this registry is accepted.',
    replay: 'The contract refuses an already consumed signed response.',
  };
  const results = {}; // `${order}:${case}` -> { state: 'busy' | 'done' | 'error', ... }
  let userRecord = '';
  const sentDigests = new Map();
  const isLocal = () => chainId === 31337 && mode !== 'sample';
  const useOwn = () => !isLocal() || s.source === 'own';
  async function chainNow() {
    if (chainId === 31337) { try { await provider.send('evm_mine', []); } catch { /* not anvil */ } }
    return Number((await provider.getBlock('latest')).timestamp);
  }
  async function signFresh(o) {
    const fields = LOCAL.registry[`${o.key}:${o.supplier}`] || LOCAL.clean[o.sourceIndex];
    const raw = JSON.stringify(fields), data = ethers.hexlify(ethers.toUtf8Bytes(raw)), ts = String(await chainNow());
    const requestHash = P.requestHashFor(o.sourceIndex, o.supplier);
    const signature = await new ethers.Wallet(LOCAL.signer[o.sourceIndex]).signMessage(ethers.getBytes(P.digestOf(requestHash, ts, data)));
    return P.normalizeRecord({ source: o.key, supplierId: o.supplier, requestHash, timestamp: ts, data, raw, signature }, o.sourceIndex);
  }
  function realInput(o, which) {
    const wantReal = chainId !== 31337;
    const pool = (window.PULSE_SAMPLE_RESPONSES || []).filter((x) => x.record.source === o.key && P.requestHashFor(o.sourceIndex, String(x.record.supplierId || '')).toLowerCase() === String(x.record.requestHash).toLowerCase())
      .sort((a, b) => (b.real === wantReal) - (a.real === wantReal));
    const hit = which === 'realOld' ? pool.find((x) => x.record.supplierId === o.supplier) : pool.find((x) => x.record.supplierId !== o.supplier);
    return hit ? P.normalizeRecord(hit.record, o.sourceIndex) : null;
  }
  function ownRecord(o) {
    if (!userRecord.trim()) throw Object.assign(new Error('This case needs a signed record of this supplier: paste or upload the file from fetch-evidence.sh under "Signed record".'), { needRecord: true });
    try { return P.normalizeRecord(JSON.parse(userRecord), o.sourceIndex); } catch (e) { throw Object.assign(new Error(`The record is not usable: ${e.message}.`), { needRecord: true }); }
  }
  const baseRecord = async (o) => (useOwn() ? ownRecord(o) : signFresh(o));
  async function ask(o, record) {
    try {
      const ret = await provider.call({ to: cfg.contract, from: P.DEAD, data: iface.encodeFunctionData('submitEvidence', [o.id, record.requestHash, BigInt(record.timestamp), record.data, record.signature]) });
      return { accepted: true, clean: iface.decodeFunctionResult('submitEvidence', ret)[0] };
    } catch (e) { const err = P.decodeRevert(iface, e); if (!err) throw e; return { accepted: false, err }; }
  }
  async function signerFor() {
    if (chainId === 31337 && !P.writeBlocked(chainId, cfg.rpc)) return new ethers.Wallet(LOCAL.agent, provider);
    return P.walletSigner(chainId, cfg.rpc);
  }
  async function runCase(o, c, { quiet = false, base = null } = {}) {
    const k = `${o.id}:${c.key}`;
    results[k] = { state: 'busy' }; if (!quiet) render();
    let tampered = null;
    try {
      let record;
      if (c.mode === 'realOld' || c.mode === 'realOther') {
        record = realInput(o, c.mode);
        if (!record) throw new Error(c.mode === 'realOld' ? `No earlier signed record of ${o.supplier} is bundled with the page.` : 'No signed record of another company is bundled for this registry.');
      } else {
        base = base || await baseRecord(o);
        if (c.mode === 'replay') {
          const dg = P.digestOf(base.requestHash, base.timestamp, base.data).toLowerCase();
          if (!sentDigests.has(dg)) { // the original must be on chain first: the one real transaction of the lab
            const first = await ask(o, base);
            if (!first.accepted) throw new Error(`The valid record itself is refused (${first.err.name}), so it cannot be replayed. ${P.explain(first.err.name, first.err.args)}`);
            const w = new ethers.Contract(cfg.contract, P.ABI, await signerFor());
            const tx = await w.submitEvidence(o.id, base.requestHash, BigInt(base.timestamp), base.data, base.signature, { gasLimit: EVIDENCE_GAS });
            const rc = await tx.wait();
            sentDigests.set(dg, { block: rc.blockNumber, hash: tx.hash });
          }
          record = base;
        } else { tampered = await P.tamper(base, c.mode, {}); record = tampered.record; }
      }
      const ans = await ask(o, record);
      const got = ans.accepted ? 'accepted' : ans.err.name;
      const what = c.mode === 'realOld' ? `An untouched record of ${o.supplier}, signed ${dayClock(Number(record.timestamp))}.` : c.mode === 'realOther' ? `An untouched record of another company (${record.supplierId}).` : c.mode === 'replay' ? 'The valid record, sent once for real, submitted a second time.' : c.mode === 'asis' ? 'The record as the Airnode signed it.' : tampered && tampered.what;
      results[k] = { state: 'done', at: Date.now(), ans, got, what, pass: got === c.expect, record, sent: c.mode === 'replay' ? sentDigests.get(P.digestOf(record.requestHash, record.timestamp, record.data).toLowerCase()) : null };
    } catch (e) {
      const f = e.needRecord || e.blocked ? { text: e.message } : P.friendlyError(e, { rpc: cfg.rpc });
      results[k] = { state: 'error', text: f.text || e.message, needRecord: !!e.needRecord };
    }
    if (!quiet) render();
    if (c.mode === 'replay') refresh(); // the send changed the order
  }
  // the whole test in one press: the valid record and the four forgeries, all simulations, then one verdict
  let suite = null; // { order, state: 'busy' | 'done', verdict }
  async function runAll(o) {
    s.last = 'all'; suite = { order: o.id, state: 'busy' }; render();
    let base = null;
    try { if (!isLocal() || useOwn()) base = ownRecord(o); else base = await signFresh(o); }
    catch (e) { suite = { order: o.id, state: 'done', verdict: 'record', text: e.message }; render(); return; }
    for (const c of cases.slice(0, 5)) { await runCase(o, c, { quiet: true, base: c.mode.startsWith('real') ? null : base }); render(); }
    const rs = cases.slice(0, 5).map((c) => results[`${o.id}:${c.key}`]);
    const valid = rs[0], attacks = rs.slice(1);
    let verdict;
    if (rs.some((r) => r.state !== 'done')) verdict = 'error';
    else if (attacks.some((r) => r.ans.accepted)) verdict = 'broken';
    else if (!valid.ans.accepted) verdict = 'untested';
    else if (attacks.some((r) => !r.pass)) verdict = 'partial'; // rejected, but not for the reason the attack targets
    else verdict = 'passed';
    suite = { order: o.id, state: 'done', verdict, refused: valid && valid.state === 'done' && !valid.ans.accepted ? valid.got : '', clean: valid && valid.state === 'done' && valid.ans.accepted && valid.ans.clean, n: attacks.filter((r) => r.state === 'done' && r.pass).length };
    render();
  }
  function verificationChecks(o, r) {
    if (!r || r.state !== 'done') return kv([['Request', 'Supplier-bound request hash'], ['Time', 'Fresh signed timestamp'], ['Signature', 'Configured Airnode'], ['Replay', 'Unused response digest'], ['Policy', "Buyer's registry rules"]]);
    const rec = r.record, age = nowSec() - Number(rec.timestamp);
    let signer = '?'; try { signer = ethers.verifyMessage(ethers.getBytes(P.digestOf(rec.requestHash, rec.timestamp, rec.data)), rec.signature); } catch { /* malformed */ }
    const trusted = consts.airnodes[o.sourceIndex] || '';
    const f = P.parseFields(rec.data), failed = f ? P.evaluate(o.sourceIndex, f, o.rules) : null;
    return kv([['Request', rec.requestHash.toLowerCase() === o.requestHash.toLowerCase() ? 'Matches this order' : `Other request ${short(rec.requestHash)}`],
      ['Time', age <= consts.maxAge ? `Signed ${P.ago(Math.max(0, age))}` : `Too old: ${P.ago(age)}`],
      ['Signature', signer.toLowerCase() === trusted.toLowerCase() ? 'Configured Airnode' : `Other key ${short(signer)}`],
      ['Replay', r.got === 'Replayed' ? 'Digest already used' : 'Unused response digest'],
      ['Policy', failed === null ? 'Signed data is not JSON' : failed === 0 ? 'Every rule passes' : `Fails: ${esc(P.failedLabels(o.sourceIndex, failed).join(', '))}`]]);
  }
  function caseNote(o, c) {
    const r = results[`${o.id}:${c.key}`];
    if (!r) return c.sub;
    if (r.state === 'busy') return 'asking the contract…';
    if (r.state === 'error') return r.needRecord ? 'needs a record' : 'could not ask';
    return `${r.got}${r.pass ? ' · as expected' : ` · expected ${c.expect}`}`;
  }
  function recordSheet(o) {
    if (mode === 'sample') return '';
    let status = '';
    if (useOwn()) {
      let r = null, err = '';
      if (userRecord.trim()) { try { r = P.normalizeRecord(JSON.parse(userRecord), o.sourceIndex); } catch (e) { err = e.message; } }
      const age = r ? nowSec() - Number(r.timestamp) : 0;
      status = err ? `Not usable: ${esc(err)}.` : r ? `${esc(String(r.supplierId || '?'))} · signed ${P.ago(Math.max(0, age))}${age > consts.maxAge ? ' · too old' : ''}${String(r.supplierId || '').toUpperCase() !== String(o.supplier).toUpperCase() ? ' · another supplier' : ''}` : 'No record yet.';
    } else status = 'A fresh record is signed for each run with the public local test key.';
    const switcher = isLocal() ? `<div class="sp-mode" role="group" aria-label="Record source" style="margin-top:10px"><button class="cursor-interaction" data-source="auto" aria-pressed="${!useOwn()}">Signed here</button><button class="cursor-interaction" data-source="own" aria-pressed="${useOwn()}">My own</button></div>` : '';
    return `<div class="sp-sheet sp-padding" style="margin-bottom:16px"><div class="sp-row sp-between"><h3>Signed record</h3>${useOwn() ? `<button class="sp-button sp-quiet cursor-interaction" data-upload>${icon('upload')}Upload</button>` : ''}</div>${switcher}<p class="sp-small sp-muted" style="margin-top:10px">${status}</p>${useOwn() ? `<textarea class="sp-code sp-record" id="sp-record" spellcheck="false" aria-label="Signed record (JSON from fetch-evidence.sh)" placeholder="Paste the JSON from api3/scripts/fetch-evidence.sh (Judge kit)">${esc(userRecord)}</textarea><input type="file" id="sp-file" accept=".json,application/json" hidden>` : ''}<p class="sp-small sp-muted" style="margin-top:10px">"Genuine old record" and "Other company" use untouched records bundled with the page.</p></div>`;
  }
  // The contract's own order of checks (_verify, then _apply). A revert names the first failed check, so every
  // check before it passed and none after it ran: the gates are read from the contract's answer, not computed here.
  const GATES = [['Order is active', ['NotActive']], ['Request is this order’s', ['WrongRequest']], ['Signed recently', ['FutureResponse', 'StaleResponse']], ['Not used before', ['Replayed']], ['Newer than the last check', ['NotNewer']], ['Signed by the expected Airnode', ['WrongSigner']], ['The order’s rules', ['SupplierFailed']]];
  function gates(r) {
    if (!r || r.state !== 'done') return '';
    const at = r.ans.accepted ? GATES.length : GATES.findIndex(([, errs]) => errs.includes(r.got));
    if (at < 0) return `<div class="sp-sheet sp-padding"><h3>Where the contract stopped</h3><p class="sp-small sp-muted" style="margin-top:8px">Rejected with ${esc(r.got)}, before the evidence checks.</p></div>`;
    const rows = GATES.map(([name], i) => {
      const last = i === GATES.length - 1;
      const [cls, ic, note] = i < at ? ['sp-pass', 'check', last ? (r.ans.clean ? 'clean · would issue a permit' : 'a rule fails · would hold') : 'passed'] : i === at ? ['sp-fail', 'x', r.got] : ['sp-skip', 'minus', 'not reached'];
      return `<div class="sp-gate ${cls}" style="--i:${i}"><span class="sp-gate-dot">${icon(ic)}</span><span>${name}</span><span>${esc(note)}</span></div>`;
    }).join('');
    const fresh = Date.now() - (r.at || 0) < 1500 ? ' sp-animate' : '';
    return `<div class="sp-sheet sp-padding${fresh}"><div class="sp-row sp-between"><h3>${r.ans.accepted ? 'Every check passed' : 'Where the contract stopped'}</h3><span class="sp-pill">eth_call</span></div><p class="sp-small sp-muted" style="margin-top:6px">The contract’s checks in its own order, read from its answer${r.ans.accepted ? '' : ': the first failed check reverts, so the ones after it never ran'}.</p><div class="sp-gates">${rows}</div></div>`;
  }
  function suiteRows(o) {
    return `<div class="sp-sheet sp-padding"><div class="sp-gates" style="margin-top:0">${cases.slice(0, 5).map((c, i) => {
      const r = results[`${o.id}:${c.key}`], done = r && r.state === 'done';
      const [cls, ic] = !r || r.state === 'busy' ? ['sp-skip', 'loader'] : done && r.pass ? ['sp-pass', 'check'] : ['sp-fail', 'x'];
      return `<div class="sp-gate ${cls}" style="--i:${i}"><span class="sp-gate-dot">${icon(ic)}</span><span>${c.name}</span><span>${done ? `${esc(r.got)}${r.pass ? '' : ` · expected ${c.expect}`}` : r && r.state === 'error' ? 'could not ask' : '…'}</span></div>`;
    }).join('')}</div></div>`;
  }

  // Edit it yourself: the signed bytes as text. A submit sends exactly what is in the box with the original
  // signature, nothing else is changed (unlike the "Edited value" case, which swaps one value by itself).
  const edits = {}; // order id -> { base, orig, text }
  function editState(o) {
    let base = null, why = '';
    if (useOwn()) {
      if (!userRecord.trim()) why = 'Paste or upload a signed record under “Signed record” first.';
      else { try { base = P.normalizeRecord(JSON.parse(userRecord), o.sourceIndex); } catch (e) { why = `The record is not usable: ${e.message}.`; } }
    } else if (edits[o.id]) base = edits[o.id].base;
    else why = 'Sign a fresh record with the local test key, then change it.';
    if (!base) return { why };
    if (base.raw == null) return { why: 'The signed data is not text, so it cannot be edited here.' };
    let e = edits[o.id];
    if (!e || e.base.signature !== base.signature || e.base.data !== base.data) e = edits[o.id] = { base, orig: base.raw, text: base.raw };
    return e;
  }
  function editDiff(orig, text) {
    if (text === orig) return { changed: false, html: 'Untouched: the exact bytes the Airnode signed.' };
    const fmt = (v) => (v === undefined ? '(none)' : typeof v === 'string' ? `"${v}"` : JSON.stringify(v));
    let a = null, b = null; try { a = JSON.parse(orig); b = JSON.parse(text); } catch { /* not JSON */ }
    let parts = '';
    if (a && b && typeof a === 'object' && typeof b === 'object') {
      const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter((k) => JSON.stringify(a[k]) !== JSON.stringify(b[k]));
      parts = keys.map((k) => `<span class="sp-pill sp-negative">${esc(k)}: ${esc(fmt(a[k]))} → ${esc(fmt(b[k]))}</span>`).join('') || '<span class="sp-pill sp-negative">same values, other bytes</span>';
    } else parts = '<span class="sp-pill sp-negative">signed bytes changed</span>';
    return { changed: true, html: `${parts}<br><span class="sp-muted">Signature: the original, unchanged.</span>` };
  }
  const editCase = (o) => { const e = edits[o.id], same = !e || e.text === e.orig; return { key: 'edit', mode: 'edit', name: 'Your edit', expect: same ? 'accepted' : 'WrongSigner', good: same }; };
  async function runEdit(o) {
    const e = editState(o); if (!e.base) return;
    const c = editCase(o), k = `${o.id}:edit`, d = editDiff(e.orig, e.text);
    s.test = 'edit'; s.last = 'case'; results[k] = { state: 'busy', c }; render();
    try {
      const record = { ...e.base, raw: e.text, data: ethers.hexlify(ethers.toUtf8Bytes(e.text)) };
      const ans = await ask(o, record), got = ans.accepted ? 'accepted' : ans.err.name;

  }
  async function editAction(what) {
    const o = selected();
    if (what === 'submit') { runEdit(o); return; }
    if (what === 'reset') { const e = edits[o.id]; if (e) e.text = e.orig; }
    if (what === 'sign') { try { const base = await signFresh(o); edits[o.id] = { base, orig: base.raw, text: base.raw }; } catch (err) { results[`${o.id}:edit`] = { state: 'error', c: editCase(o), text: err.message }; s.test = 'edit'; s.last = 'case'; } }
    render();
  }
  function editSheet(o) {
    if (mode === 'sample') return '';
    const e = editState(o);
    const head = `<div class="sp-row sp-between"><h3>Edit the signed data yourself</h3><span class="sp-pill">${icon('pen-line')}Signature kept</span></div>`;
    if (!e.base) return `<div class="sp-sheet sp-padding">${head}<p class="sp-small sp-muted" style="margin-top:8px">${esc(e.why)}</p>${useOwn() ? '' : `<button class="sp-button cursor-interaction" data-edit="sign" style="margin-top:12px">${icon('key-round')}Sign a fresh record</button>`}</div>`;
    const d = editDiff(e.orig, e.text);
    return `<div class="sp-sheet sp-padding">${head}<p class="sp-small sp-muted" style="margin-top:8px">The exact bytes the Airnode signed. Change a value, for example “active” to “liquidation”, and ask the contract with the original signature.</p><textarea class="sp-code sp-record" id="sp-edit" spellcheck="false" aria-label="Signed data, editable">${esc(e.text)}</textarea><p class="sp-small sp-edit-diff" id="sp-edit-diff" style="margin-top:10px">${d.html}</p><div class="sp-row sp-wrap" style="margin-top:12px"><button class="sp-button sp-primary cursor-interaction" data-edit="submit">${icon('send')}<span id="sp-edit-label">${d.changed ? 'Ask the contract: edited record' : 'Ask the contract: untouched record'}</span></button><button class="sp-button sp-quiet cursor-interaction" data-edit="reset" id="sp-edit-reset" ${d.changed ? '' : 'disabled'}>${icon('rotate-ccw')}Reset to signed</button></div></div>`;
  }
  function lab(o) {
    const r0 = results[`${o.id}:edit`];
    const c = s.test === 'edit' ? (r0 && r0.c) || editCase(o) : cases.find((x) => x.key === s.test) || cases[0];
    const r = results[`${o.id}:${c.key}`];
    const live = mode !== 'sample';
    const card = (cls, ic, over, h, p) => `<div class="sp-result ${cls}" role="status">${icon(ic)}<div class="sp-overline" style="color:inherit;margin-top:12px">${over}</div><h2>${h}</h2><p>${p}</p></div>`;
    let result;
    if (live && s.last === 'all' && suite && suite.order === o.id) {
      if (suite.state === 'busy') result = card('', 'loader', 'Tamper test', 'Asking the contract…', 'The valid record and four forgeries, one eth_call each.');
      else if (suite.verdict === 'passed') result = card('', 'shield-check', 'Tamper test · passed', '4/4 attacks rejected', `The genuine record is accepted (simulation: ${suite.clean ? 'would issue a permit' : 'would hold the order'}); each attack failed with the error it targets. All five are eth_call simulations: nothing was sent.`);
      else if (suite.verdict === 'partial') result = card('sp-rejected', 'triangle-alert', 'Tamper test · check the reasons', `${suite.n}/4 rejected as expected`, 'Every attack was rejected, but not every one by the check it targets. The rows below show which.');
      else if (suite.verdict === 'broken') result = card('sp-rejected', 'shield-x', 'Tamper test · not passed', 'Broken.', 'The contract accepted a forgery. Press the scenarios to see which.');
      else if (suite.verdict === 'untested') result = card('sp-rejected', 'triangle-alert', 'Tamper test · not tested', esc(suite.refused), `The valid record itself was refused, so the forgeries never reached their own checks. ${esc(P.explain(suite.refused, []) || '')} Load a fresh record and run again.`);
      else result = card('sp-rejected', 'triangle-alert', 'Tamper test', 'Not run', esc(suite.text || 'A scenario could not be asked; press it for the reason.'));
    } else if (!live || !r) result = card(c.good ? '' : 'sp-rejected', c.good ? 'shield-check' : 'shield-x', 'Expected contract result', c.good ? 'Would issue a permit' : c.expect, `${WHY[c.key]} ${live ? 'Press the scenario to ask the live contract.' : 'Sample data: open the live page to ask the contract.'}`);
    else if (r.state === 'busy') result = card('', 'loader', 'Asking the contract', '…', `An eth_call of submitEvidence from 0x…dEaD on order ${esc(o.ref)}${c.mode === 'replay' ? ', after sending the valid record once' : ''}.`);
    else if (r.state === 'error') result = card('sp-rejected', 'triangle-alert', r.needRecord ? 'Record needed' : 'Could not ask the contract', r.needRecord ? 'Load a record' : 'Not run', esc(r.text));
    else {
      const head = r.ans.accepted ? (r.ans.clean ? 'Simulation: would issue a permit' : 'Simulation: would hold the order') : r.got;
      const text = r.ans.accepted ? (c.good ? WHY.valid : 'The contract accepted a manipulated record.') : P.explain(r.ans.err.name, r.ans.err.args, { expectedSigner: consts.airnodes[o.sourceIndex] });
      // as in the design: an accepted valid record is green, every rejection red; the overline says whether it was expected
      result = card(r.ans.accepted && c.good ? '' : 'sp-rejected', r.pass ? (c.good ? 'shield-check' : 'shield-x') : 'triangle-alert', `Contract result${r.pass ? ' · as expected' : ` · expected ${c.expect}`}`, esc(head), `${esc(text)}${r.sent ? ` Sent once in block ${r.sent.block}${txLink(r.sent.hash)}.` : ''}`);
    }
    const busy = suite && suite.state === 'busy';
    return `${heading('Verification lab', 'Verify a signed record', `A clear answer for every signed record. Order ${esc(o.ref)} · ${esc(o.name)}.`)}${orderChips()}<div class="sp-lab-grid"><section><div class="sp-row sp-between"><h3>Choose a scenario</h3><span class="sp-pill">${live ? 'Live contract answers' : 'Illustrative outcomes'}</span></div><div class="sp-cases">${cases.filter((x, i) => s.mode === 'complex' || i !== 5).map((x) => `<button class="sp-case cursor-interaction" data-case="${x.key}" aria-pressed="${s.last === 'case' && x.key === s.test}">${icon(x.good ? 'file-check-2' : 'shield-alert')}<div><span>${x.name}</span><small>${live ? caseNote(o, x) : x.sub}</small></div></button>`).join('')}</div>${live ? `<button class="sp-button sp-primary cursor-interaction" data-runall ${busy ? 'disabled' : ''} style="width:100%">${icon(busy ? 'loader' : 'play')}${busy ? 'Running the tamper test…' : 'Run the tamper test'}</button>` : ''}<div style="margin-top:16px">${editSheet(o)}</div>${result}${live && s.last === 'all' && suite && suite.order === o.id ? suiteRows(o) : live && s.last === 'case' ? gates(r) : ''}${s.mode === 'complex' ? `<div class="sp-sheet sp-padding" style="margin-top:16px"><h3>Computed in your browser</h3>${r && r.state === 'done' && r.what ? `<p class="sp-small sp-muted" style="margin-top:8px">${esc(r.what)}</p>` : ''}${verificationChecks(o, r)}${r && r.state === 'done' ? `<details class="sp-disclosure" data-key="sub-${o.id}-${c.key}"${opened(`sub-${o.id}-${c.key}`)}><summary class="cursor-interaction">Submitted record</summary>${code(JSON.stringify(r.record, null, 2))}</details>` : ''}</div>` : ''}</section><aside>${recordSheet(o)}<div class="sp-sheet sp-padding"><h3>From record to payment</h3><div class="sp-step"><span class="sp-step-icon">1</span><div>Authenticate record<p class="sp-small sp-muted">Signer, request and timing.</p></div></div><div class="sp-step"><span class="sp-step-icon">2</span><div>Issue permit or hold<p class="sp-small sp-muted">Apply the order’s rules.</p></div></div><div class="sp-step"><span class="sp-step-icon">3</span><div>Release only when eligible<p class="sp-small sp-muted">Buyer approval + due date + valid permit.</p></div></div><div class="sp-rule"></div><p class="sp-small sp-muted">${live ? 'Each scenario is an eth_call simulation: nothing is sent, except the replay, which sends the valid record once.' : 'Sample data: no record is submitted and no transaction is sent.'}</p></div></aside></div>`;
  }

  // ---------------------------------------------------------------- the page

  function control() {
    if (!orders) return `${top()}<main class="sp-control-main"><div class="sp-row sp-between sp-wrap">${preview()}${modeSwitch()}</div>${readFailed ? `<div class="sp-note" style="margin-top:20px">${icon('triangle-alert')}<div><strong>Could not read the contract</strong><p class="sp-small" style="margin-top:4px">${esc(readFailed)}</p></div></div>` : ''}${s.page === 'settings' ? settingsPage() : ''}${footer()}</main>`;
    const o = selected();
    const page = { orders: () => operations(o), lab: () => lab(o), agent: agentPage, kit: () => kitPage(o), settings: settingsPage }[s.page] || (() => operations(o));
    return `${top()}<main class="sp-control-main"><div class="sp-row sp-between sp-wrap">${preview()}${modeSwitch()}</div>${page()}${footer()}</main>`;
  }

  // ---------------------------------------------------------------- render, interactions, refresh

  let lastView = '';
  function render() {
    const ae = document.activeElement, inApp = ae && ae.closest && ae.closest('#sp-control');
    const focusKey = inApp ? ['data-order', 'data-mode', 'data-page', 'data-filter', 'data-case', 'data-act', 'data-pick', 'data-source', 'data-copy', 'data-aorder', 'data-goto', 'data-edit', 'data-theme-toggle', 'data-home'].map((a) => (ae.getAttribute(a) !== null ? `[${a}="${CSS.escape(ae.getAttribute(a))}"]` : '')).join('') + (ae.hasAttribute('data-runall') ? '[data-runall]' : '') + (ae.hasAttribute('data-guide') ? '[data-guide]' : '') : '';
    const fieldFocus = inApp && (ae.id === 'sp-record' || ae.id === 'sp-edit' || (ae.name && ae.closest('#sp-settings'))) ? (ae.id ? `#${ae.id}` : `#sp-settings [name="${ae.name}"]`) : '';
    // typed Settings values survive a refresh of the same view, not a switch between Simple and Complex
    const view = `${s.page}/${s.mode}`;
    const settingsDraft = s.page === 'settings' && view === lastView && document.getElementById('sp-settings') ? Object.fromEntries(new FormData(document.getElementById('sp-settings'))) : null;
    lastView = view;
    app.innerHTML = control();
    if (settingsDraft) { const f = document.getElementById('sp-settings'); if (f) for (const [k, v] of Object.entries(settingsDraft)) if (f.elements[k]) f.elements[k].value = v; }
    app.querySelectorAll('button').forEach((b) => { if (!b.getAttribute('type')) b.type = 'button'; });
    if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    if (fieldFocus) { const t = app.querySelector(fieldFocus); if (t) { t.focus(); if (t.setSelectionRange && t.value) t.setSelectionRange(t.value.length, t.value.length); } }
    else if (focusKey) { const b = app.querySelector(focusKey); if (b) b.focus({ preventScroll: true }); }
  }
  app.addEventListener('toggle', (e) => { const k = e.target.dataset && e.target.dataset.key; if (k) { if (e.target.open) openKeys.add(k); else openKeys.delete(k); } }, true);
  app.addEventListener('input', (e) => {
    if (e.target.id === 'sp-record') { userRecord = e.target.value; for (const k of Object.keys(results)) if (results[k].needRecord) delete results[k]; }
    if (e.target.id === 'sp-edit') { // update the diff in place: a render would move the caret
      const st = edits[selected().id]; if (!st) return;
      st.text = e.target.value;
      const d = editDiff(st.orig, st.text);
      document.getElementById('sp-edit-diff').innerHTML = d.html;
      document.getElementById('sp-edit-label').textContent = d.changed ? 'Ask the contract: edited record' : 'Ask the contract: untouched record';
      document.getElementById('sp-edit-reset').disabled = !d.changed;
    }
  });
  // the lab starts again at its first scenario whenever the record under test changes (another order, source or file)
  const firstScenario = () => { s.test = 'valid'; s.last = 'case'; };
  app.addEventListener('change', async (e) => {
    if (e.target.id === 'sp-file' && e.target.files[0]) { userRecord = await e.target.files[0].text(); firstScenario(); render(); }
    else if (e.target.id === 'sp-record') { firstScenario(); render(); } // the editor picks up the pasted record
  });
  app.addEventListener('submit', (e) => {
    if (e.target.id !== 'sp-settings') return;
    e.preventDefault();
    const f = e.target, c = f.elements.contract.value.trim(), r = (f.elements.rpc ? f.elements.rpc.value : cfg.rpc).trim(), from = (f.elements.from ? f.elements.from.value : '').trim();
    const msg = document.getElementById('sp-settings-msg');
    if (c && !ethers.isAddress(c)) { msg.textContent = 'The contract address must be 0x followed by 40 hex characters.'; f.elements.contract.focus(); return; }
    if (r && !/^https?:\/\//.test(r)) { msg.textContent = 'The RPC URL must start with http:// or https://.'; if (f.elements.rpc.type !== 'hidden') f.elements.rpc.focus(); return; }

    const q = new URLSearchParams(); if (c) q.set('contract', c); if (r && r !== P.DEFAULT_RPC) q.set('rpc', r); if (from) q.set('from', from);

  });
  app.addEventListener('click', async (event) => {
    const b = event.target.closest('button'); if (!b || b.disabled) return;
    let changed = true, inspect = false, home = false;
    if (b.dataset.home !== undefined) { s.page = 'orders'; home = true; history.replaceState(null, '', `${location.pathname}${location.search}#orders`); }
    else if (b.dataset.mode) { s.mode = b.dataset.mode; s.filter = 'all'; if (s.mode === 'simple' && s.test === 'replay') s.test = 'valid'; try { localStorage.setItem('pulse-control-mode', s.mode); } catch { /* storage blocked */ } }
    else if (b.dataset.page) { s.page = b.dataset.page; history.replaceState(null, '', `${location.pathname}${location.search}#${s.page}`); }
    else if (b.dataset.order !== undefined) {
      const id = Number(b.dataset.order);
      s.open = b.closest('.sp-task') && id === s.order && s.page === 'orders' ? !s.open : true; // the open card's button closes it
      if (id !== s.order) firstScenario(); s.order = id; s.page = 'orders'; sendMsg = { id: null, html: '' }; inspect = true; history.replaceState(null, '', `${location.pathname}${location.search}#orders`); }
    else if (b.dataset.pick !== undefined) { if (Number(b.dataset.pick) !== s.order) firstScenario(); s.order = Number(b.dataset.pick); }
    else if (b.dataset.aorder !== undefined) { s.agentOrder = b.dataset.aorder === 'all' ? null : Number(b.dataset.aorder); }

    else if (b.dataset.runall !== undefined) { runAll(selected()); return; }

    else if (b.dataset.copy !== undefined) { const ok = await P.copyText(b.dataset.copy); const t = b.innerHTML; b.innerHTML = `${icon('check')}${ok ? 'Copied' : 'Select and copy'}`; if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } }); setTimeout(() => { b.innerHTML = t; if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } }); }, 1400); return; }
    else if (b.dataset.goto) { location.href = b.dataset.goto === 'sample' ? 'control.html?sample=1' : 'control.html'; return; }

  // Inspect: the selected order's panel can sit above the fold or below the list (narrow screens): bring it into view and mark it briefly
  function showConditions() {
    const p = app.querySelector('.sp-conditions') || app.querySelector('.sp-control-grid > aside > .sp-sheet'); if (!p) return;
    const r = p.getBoundingClientRect(), inline = p.classList.contains('sp-inline-conditions');
    const behavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
    if (inline) { if (r.bottom > innerHeight || r.top < 0) p.scrollIntoView({ block: r.height > innerHeight - 40 ? 'start' : 'nearest', behavior }); return; }
    if (r.top < 0 || r.top > innerHeight - 120) p.scrollIntoView({ block: 'start', behavior });
    p.classList.remove('sp-flash'); void p.offsetWidth; p.classList.add('sp-flash');
  }

  // Release or Refund: the contract's own answer first (staticCall), then the wallet; pending, included or refused
  async function act(fn) {
    const o = selected();
    sendMsg = { id: o.id, busy: true, html: '' }; render();
    try {
      const signer = await signerFor();
      const c = new ethers.Contract(cfg.contract, P.ABI, signer);
      await c[fn].staticCall(o.id);
      const gas = await c[fn].estimateGas(o.id);
      const tx = await c[fn](o.id, { gasLimit: gas * 13n / 10n }); // 30% headroom over the estimate
      const link = explorer ? `<a href="${explorer}/tx/${tx.hash}" target="_blank" rel="noopener">${short(tx.hash)}</a>` : short(tx.hash);
      sendMsg = { id: o.id, busy: true, html: `Sent ${link}, waiting for the block…` }; render();
      let rc; try { rc = await tx.wait(); } catch (e) { rc = e.receipt || null; if (!rc) throw e; }
      sendMsg = { id: o.id, busy: false, html: rc.status === 1 ? `Included in block ${rc.blockNumber}: ${link}.` : `Reverted on chain in block ${rc.blockNumber}: ${link}.` };
      await refresh();
    } catch (e) {
      const err = P.decodeRevert(iface, e);
      sendMsg = { id: o.id, busy: false, html: e.blocked ? esc(e.message) : err ? `Not sent: the contract refuses it with ${esc(err.name)}. ${esc(P.explain(err.name, err.args))}` : esc(P.friendlyError(e, { rpc: cfg.rpc }).text) };
      render();
    }
  }

  // ---------------------------------------------------------------- the Guide: a short walk through the screens (P.tour)

  function guide(from) {
    const pg = s.page;
    const steps = [
      { title: 'The Control Room', text: 'SupplierPulse pays a supplier only against a fresh, signed company-register record (Companies House or GLEIF, signed by API3’s Airnode). This screen shows why money moves, or why it waits.' },
      { el: '.sp-control-nav', title: 'Five screens', text: '<b>Operations</b> for the orders, <b>Verification lab</b> for the tamper test, <b>Agent</b> for what the agent did on its own, <b>Judge kit</b> for the terminal commands, <b>Settings</b> for the contract and the other screens.' },
      { el: '.sp-mode', title: 'Simple or Complex', text: 'Simple shows the orders that need a decision. Complex adds the order monitor, the signed evidence, the milestone schedule and the decision trail.' },
    ];
    if (pg === 'orders') steps.push(
      { el: '.sp-control-stats', title: 'The money', text: 'Tokens still locked in escrow, open orders, refunds and the registries in use: read from the contract.' },
      { el: '.sp-control-grid > section', title: 'Next decisions', text: 'Each open order, with the reason it pays or waits. <b>Inspect</b> opens its release conditions inside the card.' },
      { el: '.sp-conditions', title: 'Release conditions', text: 'The four facts the contract checks: buyer approval, registry rules, a valid payment permit and the due date. The button acts only when the contract would accept it: release a milestone, or refund the buyer.' },
      { el: '.sp-policy', title: 'Agent policy', text: 'The agent’s settings and its last on-chain action. The Agent screen lists every transaction it sent.' },
      { el: '#faq-h', title: 'What happens when…', text: 'The most frequent situations, from a passed check to missing data: what the service does and why you can trust it. Complex shows them as one table.' });
    if (pg === 'lab') steps.push(
      { el: '.sp-cases', title: 'Six scenarios', text: 'The real record and the forgeries of the API3 track. Each press asks the live contract; the answer appears under the scenario.' },
      { el: '[data-runall]', title: 'The whole test', text: 'The valid record and the four forgeries in one press, with one verdict: passed, not tested or broken.' },
      { el: '.sp-lab-grid > aside > .sp-sheet', title: 'Your own record', text: 'Paste or upload a record from fetch-evidence.sh (Judge kit), or let the local test chain sign one.' });
    steps.push(
      { el: '[data-page="lab"]', title: 'Verification lab', text: 'Try to break it: forge a signed record and see the contract refuse it.' },

  const touring = () => !!document.querySelector('.tour-card');
  const typing = () => !!(document.activeElement && document.activeElement.closest && document.activeElement.closest('#sp-settings, #sp-record'));
  let reading = false;
  async function refresh() {
    if (mode === 'sample' || reading) return;
    reading = true;
    try { await loadLive(); }
    catch (e) { const f = P.friendlyError(e, { reading: true, contract: cfg.contract, rpc: cfg.rpc }); readFailed = e.message && e.message.startsWith('No SupplierPulse') ? e.message : f.text; }
    finally { reading = false; }
    if (orders && !orders.some((x) => x.id === s.order)) s.order = (orders.find((x) => !closed(x)) || orders[0] || { id: 0 }).id;
    // never re-render under a running suite or while typing in Settings
    if (!(suite && suite.state === 'busy') && !typing() && !touring()) render();
  }
  async function start() {
    render();
    if (cfg.sample) { loadSample(); s.order = (orders.find((x) => !closed(x)) || orders[0]).id; render(); setInterval(() => { if (!typing() && !touring()) render(); }, 15000); return; }
    await refresh();
    if (orders) { const first = orders.find((x) => !closed(x)); if (first) { s.order = first.id; render(); } }
    setInterval(refresh, REFRESH_MS);
  }
  start();
})();
</script>
</body>
