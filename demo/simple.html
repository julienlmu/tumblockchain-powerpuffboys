<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try to Break It</title>
<!-- The simple view of "Try to break it" (judge.html is the detailed view). One signed record, the four tamper cases
     of the API3 track and the replay, each judged by the live contract: an eth_call of submitEvidence from 0x…dEaD,
     exactly as in judge.html. No wallet and no gas, except the one real send of the replay step. -->
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js" integrity="sha384-NRAZj94DQk3dgtsOZzVYHbYVV1DFkF5QhL5RRxF0ILZLi6OQ7CsMlun748D42JbO" crossorigin="anonymous"></script>
<script>window.ethers || document.write('<script src="vendor/ethers.umd.min.js"><\/script>');</script>
<script src="common.js"></script>
<link rel="stylesheet" href="base.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232457d6' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z'/%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<style>
  .wrap { max-width: 1180px; padding-top: var(--s5); }
  header { align-items: center; }
  .brand { font-weight: 700; font-size: var(--t0); color: var(--text); text-decoration: none; }
  .brand:hover { text-decoration: none; }
  .brand .plus { color: var(--accent); }
  /* one column on phones and tablets; from 1100 px the action and its results share the 1280×720 video frame */
  main { margin-top: var(--s5); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); }
  .col { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
  @media (min-width: 1100px) {
    main { grid-template-columns: minmax(0, 470px) minmax(0, 1fr); align-items: start; }
    #res-card { position: sticky; top: var(--s4); }
  }
  .intro h1 { font-size: var(--t4); letter-spacing: -0.02em; }
  .intro p { margin: var(--s2) 0 0; color: var(--muted); font-size: var(--t0); line-height: 1.5; max-width: 58ch; text-wrap: pretty; }
  .intro .ctx { margin-top: var(--s3); font-size: var(--t-1); }
  .intro .ctx b { color: var(--text); font-weight: 500; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s4) var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
  #res-card { gap: var(--s2); }
  .card h2 { margin: 0; font-size: var(--t0); font-weight: 600; }
  .card-head { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; justify-content: space-between; }
  .order { display: flex; flex-direction: column; gap: 4px; font-size: var(--t-1); color: var(--muted); }
  .order select { width: 100%; }
  .rec-line { margin: 0; display: flex; gap: var(--s2); align-items: flex-start; }
  .rec-line .i { margin-top: 0.2em; }
  .rec-line.ok .i { color: var(--ok); } .rec-line.warn { color: var(--wait); } .rec-line.bad { color: var(--hold); }
  .rec-line.info { color: var(--muted); }
  .rec-line .sub { color: var(--muted); }
  .rec-line.warn .sub, .rec-line.bad .sub { color: inherit; }
  .rec-line a { color: var(--accent); }
  .acts { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; }
  textarea { width: 100%; font-family: var(--mono); font-size: 12px; line-height: 1.45; resize: vertical; display: block; }
  textarea[aria-invalid="true"] { border-color: var(--hold); }
  /* text buttons keep a 32 px touch target */
  button.link { background: none; border: none; padding: 6px 0; min-height: 32px; color: var(--accent); font-size: var(--t-1); }
  button.link:hover { background: none; text-decoration: underline; }
  details.how > summary, details.help > summary { color: var(--accent); min-height: 32px; }
  /* every disclosure marker on the right, as on the result rows */
  details.how > summary::before, details.help > summary::before { order: 9; }
  .how-body { margin-top: var(--s2); font-size: var(--t-1); color: var(--muted); display: flex; flex-direction: column; gap: var(--s2); }
  .cmd-line { display: flex; gap: 6px; align-items: flex-start; }
  .cmd-line code { flex: 1 1 auto; min-width: 0; background: var(--bg); padding: 6px 8px; border-radius: var(--r-sm); overflow-wrap: anywhere; color: var(--text); }
  .cmd-line .copy { margin-left: 0; flex: none; }
  /* a dragged file can land anywhere: the record card shows where it goes */
  body.dragging #rec-card { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }

  button.run { min-height: 52px; font-size: var(--t1); border-radius: var(--r-lg); }
  /* from 1100 px the button stays in view while the record card grows (one size in every state; only the fill changes) */
  @media (min-width: 1100px) { #run { position: sticky; bottom: var(--s4); z-index: 1; } }
  .kb-k { font-size: 10px; padding: 1px 4px; margin-left: 8px; color: var(--muted); font-weight: 500; }
  button.primary .kb-k { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 45%, transparent); }
  @media (hover: none) { .kb-k { display: none; } }

  /* the verdict: one sentence, coloured by the outcome, with its icon and word (never colour alone) */
  #verdict:focus { outline: none; }
  /* focus moved here by the page (not by Tab): a quiet ring in the verdict's own colour, so the video shows no selection */
  #verdict:focus-visible .verdict { outline: 1px solid currentColor; outline-offset: 2px; }
  .verdict-tools { display: flex; justify-content: flex-end; margin-top: calc(-1 * var(--s1)); }
  #verdict { display: flex; flex-direction: column; gap: var(--s3); }
  #verdict:empty { display: none; }
  .verdict { border-radius: var(--r-md); padding: var(--s3) var(--s4); display: flex; gap: var(--s3); align-items: flex-start; }
  .verdict .i { width: 26px; height: 26px; stroke-width: 2.2; }
  .verdict .big { font-size: var(--t2); font-weight: 700; line-height: 1.2; }
  .verdict .why { margin-top: 2px; color: var(--text); }
  .verdict .why a { color: inherit; text-decoration: underline; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.warn { background: var(--wait-bg); color: var(--wait); }
  .verdict.bad { background: var(--hold-bg); color: var(--hold); }
  .verdict.done { background: var(--done-bg); color: var(--done); }
  .next { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; font-size: var(--t-1); color: var(--muted); }
  .next .msg { color: var(--text); flex-basis: 100%; }
  .next .fresh.warn { color: var(--wait); font-weight: 600; }
  /* old results turn grey, not faint: every word keeps its contrast */
  #res-card.stale .verdict { background: var(--done-bg); color: var(--done); }
  #res-card.stale .rows li .st, #res-card.stale .rows li .out { color: var(--muted); font-weight: 400; }
  .stale-note { margin: 0; font-size: var(--t-1); color: var(--muted); }

  .grp { margin: 2px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows > li { border-top: 1px solid var(--line); }
  .rows > li:first-child { border-top: none; }
  .rows summary { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 14px; gap: var(--s3); align-items: center; width: 100%; padding: 6px var(--s2); margin: 0 calc(-1 * var(--s2)); box-sizing: content-box; color: var(--text); font-size: var(--t0); border-radius: var(--r-sm); }
  .rows summary::before { order: 9; color: var(--muted); }
  .rows summary:hover { color: var(--text); background: var(--raised); }
  .nm { display: flex; flex-direction: column; min-width: 0; }
  .nm b { font-weight: 600; }
  .nm .sub { color: var(--muted); font-size: var(--t-1); }
  .st { display: grid; place-items: center; width: 24px; height: 24px; }
  .st .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line-strong); }
  .out { font-size: var(--t-1); color: var(--muted); text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .out .mono { font-size: 12px; }
  li.pass .st, li.pass .out { color: var(--ok); }
  li.near .st, li.near .out { color: var(--wait); }
  li.fail .st, li.fail .out { color: var(--hold); }
  li.pass .out, li.near .out, li.fail .out { font-weight: 600; }
  .more { margin: 0 0 var(--s3) calc(24px + var(--s3)); font-size: var(--t-1); color: var(--muted); display: flex; flex-direction: column; gap: var(--s1); overflow-wrap: anywhere; }
  .more p { margin: 0; }
  .more .what { color: var(--text); }
  .help-body { margin-top: var(--s2); font-size: var(--t-1); color: var(--muted); display: flex; flex-direction: column; gap: var(--s2); }
  .help-body ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px; }
  .help-body b { color: var(--text); font-weight: 500; }
  .help-body p { margin: 0; }
  .keys-toggle { display: inline-flex; gap: var(--s2); align-items: center; color: var(--text); margin-left: var(--s2); }
  .keys-toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  .foot { margin: var(--s5) 0 0; font-size: var(--t-1); color: var(--muted); text-align: center; }

  @media (max-width: 520px) {
    .card { padding: var(--s4); }
    #theme-btn .lbl { display: none; }
    .rows summary { grid-template-columns: 24px minmax(0, 1fr) 14px; }
    .rows summary .out { grid-column: 2; grid-row: 2; align-items: flex-start; text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" id="dash-link" href="index.html">SupplierPulse</a>
    <div class="head-links">
      <nav class="view-switch" aria-label="View"><a href="simple.html" aria-current="page">Simple</a><a id="detailed-link" href="judge.html">Detailed</a></nav>
      <button type="button" id="guide-btn" data-icon="info" aria-label="Guide: a short walk through this page">Guide</button>
      <button type="button" id="theme-btn" aria-keyshortcuts="T" aria-label="Colour theme: auto. Switch theme"><span class="lbl">Theme: auto</span></button>
    </div>
  </header>

  <main>
    <div class="col">
      <div class="intro">
        <h1>Try to break it</h1>
        <p>Forge a signed register record four ways. The contract should refuse every forgery.</p>
        <p class="ctx" id="ctx">Connecting to the contract…</p>
      </div>

      <section class="card" id="rec-card" aria-labelledby="rec-h">
        <h2 id="rec-h" class="sr-only">The signed record</h2>
        <div class="order"><label for="order">Order</label>
          <select id="order" aria-describedby="order-hint" disabled><option>Reading the orders…</option></select>
          <span id="order-hint" class="sr-only"></span></div>
        <p class="rec-line" id="rec-line"></p>
        <p class="sr-only" id="rec-sr" role="status" aria-live="polite"></p>
        <div class="acts" id="local-acts" hidden>
          <button type="button" id="resign" data-icon="key">New record</button>
          <button type="button" class="link" id="own-toggle" aria-expanded="false" aria-controls="own">Use my own</button>
        </div>
        <div id="own" hidden>
          <textarea id="resp" rows="4" spellcheck="false" aria-label="Signed record (JSON)" aria-keyshortcuts="Meta+Enter Control+Enter" placeholder="Paste or drop a signed record (JSON)"></textarea>
          <div class="acts" style="margin-top: var(--s2)">
            <button type="button" id="upload-btn" data-icon="upload">Upload file</button><input type="file" id="file" accept=".json,application/json" hidden>
            <button type="button" class="link" id="clear-rec" disabled>Clear</button>
            <details class="how" id="how"><summary>Get one</summary><div class="how-body" id="how-body"></div></details>
          </div>
        </div>
      </section>

      <button type="button" class="primary run" id="run" aria-keyshortcuts="R" disabled>Run the tamper test</button>
    </div>

    <section class="card" id="res-card" aria-labelledby="res-h">
      <div class="card-head"><h2 id="res-h">What the contract says</h2><button type="button" class="link" id="expand-all" aria-pressed="false">Expand all</button></div>
      <div id="verdict" tabindex="-1"></div>
      <div id="rows"></div>
      <details class="help" id="help"><summary aria-keyshortcuts="?">How the contract decides</summary><div class="help-body" id="help-body"></div></details>
    </section>
    <p class="sr-only" id="verdict-sr" role="status" aria-live="polite"></p>
  </main>

</div>

<script>
(() => {
  const P = window.PULSE;
  const { esc, short, nowSec } = P;
  const $ = (id) => document.getElementById(id);
  // Public anvil test keys (§4.8), the same as judge.html. Used only on the local test chain (chain id 31337).
  const LOCAL = {
    signer: ["0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d", "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"],
    agent: "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6",
    // api3/x402/local-registry.json
    registry: {
      "ch:01234567": { accounts_overdue: false, confirmation_overdue: false, status: "active" },
      "ch:07654321": { accounts_overdue: true, confirmation_overdue: false, status: "liquidation" },
      "gleif:TESTLEI0000000000000": { entity_status: "ACTIVE", registration_status: "ISSUED" },
      "gleif:TESTLEI0000000000001": { entity_status: "ACTIVE", registration_status: "LAPSED" },
    },
    clean: [{ accounts_overdue: false, confirmation_overdue: false, status: "active" }, { entity_status: "ACTIVE", registration_status: "ISSUED" }],
  };
  // The real record, the four tamper cases of the API3 track (named as in the detailed view), then the replay.
  const ROWS = [
    { mode: "asis", name: "The real record", sub: "untouched", expect: "accepted", check: "should pass",
      before: "The record as the Airnode signed it. The contract should accept it: genuine, fresh and meant for this order." },
    { mode: "value", name: "(a) Edit value", sub: "one value in the signed data changed, signature kept", expect: "WrongSigner", check: "signer check",
      before: "One value in the signed data is changed (for example status \"active\" → \"liquidation\") and the signature is kept. The signature then recovers to another address, so the signer check should reject it: WrongSigner." },
    { mode: "stale", name: "(b) Too old", sub: "signed time moved one hour back", expect: "StaleResponse", check: "freshness check",
      before: "The signed time is moved one hour back. The freshness check should reject it: StaleResponse." },
    { mode: "request", name: "(c) Different request", sub: "another company's request", expect: "WrongRequest", check: "request check",
      before: "The request of another company is swapped in. The request check should reject it: WrongRequest." },
    { mode: "key", name: "(d) Wrong key", sub: "re-signed by a random key", expect: "WrongSigner", check: "signer check",
      before: "The untouched record is re-signed with a random key. The signer check should reject it: WrongSigner." },
  ];
  const REPLAY = { mode: "replay", name: "Replay", sub: "the real record, a second time", expect: "Replayed", check: "replay check",
    before: "After a passed test the real record is sent for real (the one real transaction), then submitted once more. The replay check should reject it: Replayed." };
  // durations in one style: "5 min", "4 min 58 s"
  const dur = (sec) => (sec >= 60 && sec % 60 === 0 ? `${sec / 60} min` : P.span(sec));
  // Not tested: what helps depends on why the contract refused the real record
  const FIX = {
    StaleResponse: "get a fresh record and run again", NotNewer: "get a fresh record and run again", Replayed: "get a fresh record and run again",
    FutureResponse: "check the clock of the machine that signed it, or get a fresh record",
    NotActive: "this order is held or closed and refuses every record: pick an Active order",
    WrongRequest: "the record is for another company: pick the order of its supplier, or load a record of this order's supplier",
    SupplierFailed: "load a record of this supplier signed after its failed one",
    WrongSigner: "load a record signed by the Airnode this contract trusts (fetch-evidence.sh)",
  };

  try { localStorage.setItem("pulse-view", "simple"); } catch { /* storage blocked */ } // the dashboard opens the same view
  const params = new URLSearchParams(location.search);
  // link parameters only in the expected shape (the RPC URL also reaches a copyable command)
  const cfg = { contract: P.safeAddress(params.get("contract")) || "", rpc: P.safeRpc(params.get("rpc")) || P.DEFAULT_RPC, order: params.get("order") };

  // ---------------------------------------------------------------- theme (shared with the other pages)

  // single-key shortcuts can be switched off (WCAG 2.1.4); one setting for both views of "Try to break it"
  const keysOn = () => { try { return localStorage.getItem("pulse-judge-keys") !== "off"; } catch { return true; } };
  const THEMES = ["auto", "light", "dark"];
  let theme = "auto";
  try { theme = localStorage.getItem("pulse-theme") || "auto"; } catch { /* storage blocked */ }
  function applyTheme() {
    if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
    $("theme-btn").innerHTML = `${P.icon("theme")}<span class="lbl">Theme: ${theme}</span>`;
    $("theme-btn").setAttribute("aria-label", `Colour theme: ${theme}. Switch theme`);
  }
  function nextTheme() {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem("pulse-theme", theme); } catch { /* storage blocked */ }
    applyTheme();
  }
  $("theme-btn").addEventListener("click", nextTheme);
  applyTheme();
  P.hydrateIcons();

  // ---------------------------------------------------------------- state

  let provider = null, contract = null, chainId = null, explorer = null, version = 2, maxAge = 300;
  let iface = new ethers.Interface(P.ABI);
  const order = { id: null, info: null, airnode: null };
  const nameOf = P.orderNamer();
  const sent = new Map(); // digest -> block of the records this tab sent for real
  let record = null, recordErr = "", ownMode = false, busy = false, stopRequested = false, lastPass = null, haveResults = false, needRecord = false;
  let allOrders = [], loadingOrder = false;
  // the record box's text survives a switch to the detailed view and a reload (this tab only); a real send clears it
  const DRAFT = "pulse-record";
  const saveDraft = (text) => { try { sessionStorage.setItem(DRAFT, JSON.stringify({ text, at: Date.now() })); } catch { /* storage blocked */ } };
  const loadDraft = () => { try { return (JSON.parse(sessionStorage.getItem(DRAFT) || "null") || {}).text || ""; } catch { return ""; } };
  const dropDraft = () => { try { sessionStorage.removeItem(DRAFT); } catch { /* storage blocked */ } };
  const isLocal = () => chainId === 31337 && version === 2;
  const digestOf = (r) => P.digestOf(r.requestHash, r.timestamp, r.data).toLowerCase();
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wide = () => matchMedia("(min-width: 1100px)").matches;

  // One order model for v1 and v2, the same as judge.html.
  async function readOrder(id) {
    if (version === 2) {
      const [info, st] = await Promise.all([contract.orderInfo(id), contract.orderStatus(id)]);
      return { source: Number(info.source), supplierId: info.supplierId, requestHash: info.requestHash, orderRef: info.orderRef, state: Number(st.state), lastCheck: Number(st.lastCheck) };
    }
    const [info, st, num] = await Promise.all([contract.orderInfo(id), contract.orderStatus(id), contract.companyNumberOf(id)]);
    return { source: 0, supplierId: num, requestHash: info.companyRequest, orderRef: info.orderRef, state: Number(st.state), lastCheck: Number(st.lastCheck) };
  }
  const airnodeFor = (source) => (version === 2 ? contract.airnodeOf(source) : contract.airnode());
  async function chainNow() {
    // a local anvil only mines on transactions: mine one empty block so its clock is now (local test chain only)
    if (chainId === 31337) { try { await provider.send("evm_mine", []); } catch { /* not anvil */ } }
    return Number((await provider.getBlock("latest")).timestamp);
  }

  // The other view and the dashboard keep the contract, the network and the order.
  function detailedHref() {
    const q = new URLSearchParams();
    if (cfg.contract) q.set("contract", cfg.contract);
    if (cfg.rpc !== P.DEFAULT_RPC) q.set("rpc", cfg.rpc);
    if (order.id !== null) q.set("order", order.id);
    return "judge.html" + (q.toString() ? "?" + q : "");
  }
  function viewLinks() {
    const q = new URLSearchParams();
    if (cfg.contract) q.set("contract", cfg.contract);
    if (cfg.rpc !== P.DEFAULT_RPC) q.set("rpc", cfg.rpc);
    const dq = q.toString();
    $("detailed-link").href = detailedHref();
    $("dash-link").href = (version === 1 ? "v1.html?orders=0,1" + (dq ? "&" + dq : "") : "index.html" + (dq ? "?" + dq : ""));
  }
  // Errors in plain words. This page has no Settings panel: where the shared text points there, it links the detailed
  // view's; an unexpected answer keeps its raw text one click away.
  function errHtml(e) {
    const f = P.friendlyError(e, { rpc: cfg.rpc });
    if (f.kind === "other") {
      const raw = f.text.replace(/^Unexpected answer from the RPC or the contract: /, "");
      return `Unexpected answer from the RPC or the contract. <details class="how"><summary>Technical details</summary><span class="mono">${esc(raw)}</span></details>`;
    }
    return esc(f.text).replace(/ in Settings/g, ` in the <a href="${detailedHref()}">detailed view's</a> Settings`);
  }

  // ---------------------------------------------------------------- the record

  // The visible line ticks every second; screen readers hear it only when what it says changes, not each tick.
  let lastSaid = "";
  function recLine(kind, html, said) {
    const icon = { ok: "check", warn: "alert", bad: "x", wait: "loader", info: "info" }[kind];
    $("rec-line").className = "rec-line " + kind;
    $("rec-line").innerHTML = `${P.icon(icon, kind === "wait" ? "spin" : "")}<span>${html}</span>`;
    const say = said || $("rec-line").textContent;
    if (say !== lastSaid) { lastSaid = say; $("rec-sr").textContent = say; }
  }
  function describe(r) {
    const s = P.SOURCES[P.sourceIndex(r.source)] || P.SOURCES[0];
    return `${esc(s.name)} <span class="mono">${esc(r.supplierId || "?")}</span>`;
  }
  // "local Companies House key, anvil #1" -> "local Companies House test key"; the address and index live in the help
  const signerName = (a) => ((a && P.KNOWN_SIGNERS[a.toLowerCase()]) || "an Airnode key").replace(/^local (.*) key, anvil #\d+$/, "local $1 test key");
  const noSetupLink = () => `<a href="${detailedHref()}">try without one</a>`;
  // Says what the loaded record is, and what is wrong with it, before Run is pressed.
  function showRecord() {
    if (!order.info) return;
    const who = record ? describe(record) : "";
    if (order.info.state !== 0) {
      recLine("warn", `Order #${order.id} is ${esc(P.STATE[order.info.state])} and refuses every record. Pick an Active order.`);
      return;
    }
    if (recordErr) { recLine("bad", esc(recordErr)); return; }
    if (!record) {
      if (needRecord) recLine("warn", `Paste or upload a signed record first.${isLocal() ? "" : ` <span class="sub">Or ${noSetupLink()}.</span>`}`);
      else if (isLocal() && !ownMode) recLine("info", "No record yet.");
      else recLine("info", `No record yet. <span class="sub">Or ${noSetupLink()}.</span>`);
      return;
    }
    const age = nowSec() - Number(record.timestamp);
    if (record.supplierId && String(record.supplierId).toUpperCase() !== String(order.info.supplierId).toUpperCase()) {
      const hit = allOrders.find((o) => o.state === 0 && String(o.supplierId).toUpperCase() === String(record.supplierId).toUpperCase());
      const k = hit ? hit.id : -1;
      recLine("warn", `This record is for ${who}, not this order.
        ${k >= 0 ? `<button type="button" class="link" data-switch="${k}">Switch to order #${k}</button>` : ""}`, "The record is for another company than this order.");
    }
    else if (sent.has(digestOf(record)))
      recLine("info", `Sent in block ${sent.get(digestOf(record))}. <span class="sub">${isLocal() && !ownMode ? "Run signs a new one." : "Load a fresh one to test again."}</span>`, "The record was sent for real.");
    else if (age > maxAge)
      recLine("warn", `Too old: signed ${P.ago(age)}, the limit is ${dur(maxAge)}. <span class="sub">${isLocal() && !ownMode ? "Run signs a new one." : "Get a fresh one below."}</span>`, "The record is too old.");
    else if (maxAge - age < 60 && !(isLocal() && !ownMode))
      recLine("warn", `Expires in ${P.span(maxAge - age)}: run now.`, "The record expires in less than a minute.");
    else
      recLine("ok", `Fresh record of ${who} <span class="sub">· valid ${P.span(maxAge - age)}</span>`, "A fresh record is loaded.");
  }
  setInterval(() => { if (record && !recordErr) showRecord(); replayFresh(); }, 1000);
  $("rec-line").addEventListener("click", (e) => {
    const b = e.target.closest("[data-switch]");
    if (!b || busy) return;
    $("order").value = b.dataset.switch;
    selectOrder(Number(b.dataset.switch)).catch((err) => recLine("bad", errHtml(err)));
  });

  function readBox() {
    const text = $("resp").value.trim();
    record = null; recordErr = "";
    $("resp").removeAttribute("aria-invalid");
    $("resp").removeAttribute("aria-describedby");
    if (!text) return;
    let obj;
    try { obj = JSON.parse(text); } catch { recordErr = "This is not valid JSON. Paste the whole file from fetch-evidence.sh."; }
    if (obj) { try { record = P.normalizeRecord(obj, order.info ? order.info.source : 0); } catch (e) { recordErr = `This is not a signed record: ${e.message}.`; } }
    if (recordErr) { $("resp").setAttribute("aria-invalid", "true"); $("resp").setAttribute("aria-describedby", "rec-line"); }
  }
  function recordChanged() {
    needRecord = false; readBox(); showRecord(); markStale();
    $("clear-rec").disabled = !$("resp").value.trim();
    saveDraft($("resp").value);
    runLabel();
  }
  let typing = null;
  $("resp").addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(recordChanged, 300); });
  async function loadFile(f) {
    if (!f) return;
    if (!ownMode) setOwn(true, false);
    $("resp").value = await f.text();
    recordChanged();
  }
  $("upload-btn").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", async (e) => { await loadFile(e.target.files[0]); e.target.value = ""; });
  // a .json file dropped anywhere loads like an upload; the browser never navigates away to it
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  document.addEventListener("dragenter", (e) => { if (hasFiles(e)) { dragDepth++; document.body.classList.add("dragging"); } });
  document.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove("dragging"); });
  document.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    if (!busy) loadFile(e.dataTransfer.files[0]);
  });
  let clearUndo = null;
  $("clear-rec").addEventListener("click", () => {
    const saved = $("resp").value;
    $("resp").value = ""; recordChanged(); $("resp").focus();
    recLine("info", `Record cleared · <button type="button" class="link" id="undo-clear">Undo</button>`, "Record cleared.");
    clearTimeout(clearUndo);
    clearUndo = setTimeout(() => { if (!$("resp").value) showRecord(); }, 10000);
    $("undo-clear").addEventListener("click", () => { clearTimeout(clearUndo); $("resp").value = saved; recordChanged(); $("resp").focus(); });
  });
  $("resp").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runClick(); } });

  // Local test chain: a fresh record of the order's supplier, signed in the browser with the public test key.
  async function signFresh() {
    const source = Number(order.info.source), id = order.info.supplierId;
    const fields = LOCAL.registry[`${P.SOURCES[source].key}:${id}`] || LOCAL.clean[source];
    const raw = JSON.stringify(fields);
    const data = ethers.hexlify(ethers.toUtf8Bytes(raw));
    const ts = String(await chainNow());
    const requestHash = P.requestHashFor(source, id);
    const w = new ethers.Wallet(LOCAL.signer[source]);
    const signature = await w.signMessage(ethers.getBytes(P.digestOf(requestHash, ts, data)));
    record = P.normalizeRecord({ source: P.SOURCES[source].key, supplierId: id, airnode: w.address, requestHash, timestamp: ts, data, raw, signature }, source);
    recordErr = ""; needRecord = false;
    showRecord();
  }
  $("resign").addEventListener("click", () => signFresh().then(markStale).catch((e) => recLine("bad", errHtml(e))));
  function setOwn(on, focus = true) {
    ownMode = on;
    $("own").hidden = !on;
    $("own-toggle").setAttribute("aria-expanded", String(on));
    $("own-toggle").textContent = on ? "Sign one in the browser" : "Use my own";
    if (on) { readBox(); if (focus) $("resp").focus(); } else if (isLocal() && order.info) signFresh().catch(() => {});
    showRecord(); markStale();
  }
  $("own-toggle").addEventListener("click", () => setOwn(!ownMode));

  function howToGet() {
    const s = order.info ? P.SOURCES[order.info.source] : P.SOURCES[0];
    // a supplier id goes into a copyable command only in the contract's format, single-quoted
    const id = P.safeSupplierId(order.info ? order.info.source : 0, order.info ? order.info.supplierId : "09729896");
    if (!id) { $("how-body").innerHTML = `<p style="margin:0">No command shown: this order's supplier id is not in a registry's format.</p>`; return; }
    const cmd = version === 1 ? `api3/scripts/supplier-fetch.sh ${P.shq(id)}` : `api3/scripts/fetch-evidence.sh ${s.key} ${P.shq(id)} response.json`;
    $("how-body").innerHTML = `<div class="cmd-line"><code>${esc(cmd)}</code>${P.copyBtn(cmd)}</div>
      <p style="margin:0">From a checkout of this repo, with Node 22 or newer and <span class="mono">PAYER_PRIVATE_KEY</span> set to a Base Sepolia
      wallet holding aUSD (free from <a href="https://api3dao.github.io/airnodehub-hackathon/faucet/" target="_blank" rel="noopener">API3's faucet</a>).
      Each record costs $0.01 and stays fresh for ${dur(maxAge)}. Then upload <span class="mono">response.json</span> here, or drop it on the page.</p>`;
  }
  function helpText() {
    const link = explorer ? `<a href="${explorer}/address/${cfg.contract}" target="_blank" rel="noopener">the contract on the explorer</a>` : "the contract";
    $("help-body").innerHTML = `<p>The contract checks every record in this order and stops at the first check it fails:</p>
      <ol><li>The order is active <span class="mono">NotActive</span></li>
        <li>The request matches the order: stops <b>(c)</b> <span class="mono">WrongRequest</span></li>
        <li>Not dated in the future <span class="mono">FutureResponse</span></li>
        <li>Fresh, at most ${dur(maxAge)} old: stops <b>(b)</b> <span class="mono">StaleResponse</span></li>
        <li>Not used before: stops the <b>replay</b> <span class="mono">Replayed</span></li>
        <li>Newer than the order's last record <span class="mono">NotNewer</span></li>
        <li>Signed by the trusted Airnode: stops <b>(a)</b> and <b>(d)</b> <span class="mono">WrongSigner</span></li></ol>
      <p>"Simulated" means an <span class="mono">eth_call</span> of <span class="mono">submitEvidence</span> from <span class="mono">0x…dEaD</span>: the contract's own answer, with nothing sent.
        The replay step is the one real transaction. A purchase order pays its milestones only after a fresh signed record of its supplier passes.</p>
      <p>Trusted signer of this order: ${esc((order.airnode && P.KNOWN_SIGNERS[order.airnode.toLowerCase()]) || "unknown")} <span class="mono">${order.airnode ? esc(order.airnode) : ""}</span>.</p>
      <p>Keys: <kbd>R</kbd> run · <kbd>Esc</kbd> stop · <kbd>S</kbd> send and replay · <kbd>O</kbd> order · <kbd>1</kbd>–<kbd>6</kbd> open a row · <kbd>?</kbd> this help · <kbd>T</kbd> theme · <kbd>⌘/Ctrl</kbd>+<kbd>Enter</kbd> in the record box runs.
        <label class="keys-toggle"><input type="checkbox" id="keys-on"${keysOn() ? " checked" : ""}> Single-key shortcuts on</label></p>
      <p>See ${link} · <a href="https://github.com/julienlmu/tumblockchain-powerpuffgirls/blob/main/demo/README.md" target="_blank" rel="noopener">README</a> · <a href="${detailedHref()}">detailed view</a></p>`;
  }

  // ---------------------------------------------------------------- results

  function rowHtml(row) {
    return `<li data-mode="${row.mode}"><details><summary><span class="st" aria-hidden="true"><span class="dot"></span></span>
      <span class="nm"><b>${esc(row.name)}</b></span><span class="out">${esc(row.check)}</span></summary>
      <div class="more"><p>${esc(row.before)}</p></div></details></li>`;
  }
  function resetResults() {
    lastPass = null; haveResults = false;
    $("res-card").classList.remove("stale");
    $("verdict").innerHTML = "";
    $("rows").innerHTML = `<ul class="rows">${rowHtml(ROWS[0])}</ul><h3 class="grp">The four forgeries</h3><ol class="rows">${ROWS.slice(1).map(rowHtml).join("")}</ol>
      <h3 class="grp">After a pass</h3><ul class="rows">${rowHtml(REPLAY)}</ul>`;
    runLabel();
    syncExpand();
  }
  // Results stay after a change, dimmed, until the next run: a recorded demo never loses its evidence by accident.
  function markStale() {
    if (!haveResults || busy) return;
    $("res-card").classList.add("stale");
    const next = $("verdict").querySelector(".next");
    if (next) next.remove();
    if (!$("verdict").querySelector(".stale-note")) $("verdict").insertAdjacentHTML("afterbegin", `<p class="stale-note">These results are for the record or order before your change. Press Run to test again.</p>`);
    lastPass = null;
    runLabel();
  }
  function setRow(mode, state, out, more) {
    const li = $("rows").querySelector(`li[data-mode="${mode}"]`);
    li.className = state;
    const icon = { running: P.icon("loader", "spin"), pass: P.icon("check"), near: P.icon("alert"), fail: P.icon("x") }[state] || `<span class="dot"></span>`;
    li.querySelector(".st").innerHTML = icon;
    if (out !== undefined) li.querySelector(".out").innerHTML = out;
    if (more !== undefined) li.querySelector(".more").innerHTML = more;
  }
  function syncExpand() {
    const ds = [...$("rows").querySelectorAll("details")];
    const all = ds.length > 0 && ds.every((d) => d.open);
    $("expand-all").textContent = all ? "Collapse all" : "Expand all";
    $("expand-all").setAttribute("aria-pressed", String(all));
  }
  $("expand-all").addEventListener("click", () => {
    const ds = [...$("rows").querySelectorAll("details")];
    const open = !ds.every((d) => d.open);
    for (const d of ds) d.open = open;
    syncExpand();
  });
  $("rows").addEventListener("toggle", syncExpand, true);

  // One attempt: the tampered record, asked of the contract as an eth_call of submitEvidence from 0x…dEaD.
  async function attempt(base, mode) {
    let t;
    try { t = await P.tamper(base, mode, version === 1 ? { requestHashFor: P.requestHashV1 } : {}); }
    catch (e) { const err = new Error(`This record cannot be forged this way (${e.message}). Load a Companies House or GLEIF record from fetch-evidence.sh.`); err.record = true; throw err; }
    const r = t.record;
    try {
      const ret = await provider.call({ to: cfg.contract, from: P.DEAD, data: iface.encodeFunctionData("submitEvidence", [order.id, r.requestHash, BigInt(r.timestamp), r.data, r.signature]) });
      return { t, accepted: true, clean: iface.decodeFunctionResult("submitEvidence", ret)[0] };
    } catch (e) {
      const err = P.decodeRevert(iface, e);
      if (!err) throw e; // the RPC, not the contract, failed
      return { t, accepted: false, err };
    }
  }
  // pass = as the track expects; near = rejected, but by an earlier check (or the real record refused); fail = a forgery accepted
  function judge(row, a) {
    if (row.mode === "asis") return a.accepted ? "pass" : "near";
    if (a.accepted) return "fail";
    return a.err.name === row.expect ? "pass" : "near";
  }
  // the plain check stays next to the contract's own error name after the run
  function outText(row, a, state) {
    if (a.accepted) return row.mode === "asis" ? (a.clean ? "Accepted" : "Accepted, held") : "Accepted!";
    const name = `<span class="mono">${esc(a.err.name)}</span>`;
    return row.mode === "asis" ? `Refused${name}` : state === "pass" ? `Rejected${name}` : `Stopped earlier${name}`;
  }
  function moreText(row, a, state) {
    const why = a.accepted
      ? (a.clean ? "The record is genuine, fresh and meant for this order, and the supplier passes every rule: the contract would issue a payment permit, the go-ahead to pay the next milestone." : "The record is genuine, but the supplier fails the buyer's rules: the contract would hold the order and protect the balance.")
      : P.explain(a.err.name, a.err.args, { expectedSigner: order.airnode });
    const note = state === "near" && row.mode !== "asis" ? `<p>Expected <span class="mono">${esc(row.expect)}</span>: an earlier check stopped it first.</p>` : "";
    return `<p class="what">${esc(a.t.what)}</p><p>${esc(why)}</p>${note}`;
  }

  function verdict(kind, big, why, next = "") {
    const icon = { ok: "shield", warn: "alert", bad: "x", done: "stop" }[kind];
    const copy = haveResults ? `<div class="verdict-tools"><button type="button" class="link" id="copy-result" data-icon="copy">Copy result</button></div>` : "";
    $("verdict").innerHTML = `<div class="verdict ${kind}">${P.icon(icon)}<div><div class="big">${big}</div><div class="why">${why}</div></div></div>${next}${copy}`;
    $("verdict-sr").textContent = `${big}. ${$("verdict").querySelector(".why").textContent}`;
    P.hydrateIcons($("verdict"));
  }
  // The run button: Run, Stop while a run goes (Esc too), and a smaller "Run again" once results are in.
  function runLabel() {
    const b = $("run");
    const kb = (k) => (keysOn() ? `<kbd class="kb-k" aria-hidden="true">${k}</kbd>` : "");
    if (busy) { b.innerHTML = `${P.icon("stop")}Stop${kb("Esc")}`; return; }
    b.classList.toggle("primary", !lastPass); // after a pass, the replay is the next step
    // without a usable record (off the local chain) the button says what it will do: open the way to a record
    if (order.info && ownMode && !record) { b.innerHTML = `${P.icon("upload")}Load a signed record to run`; return; }
    b.innerHTML = `${P.icon("play")}${haveResults ? "Run again" : "Run the tamper test"}${kb("R")}`;
  }
  function setBusy(on) {
    busy = on; stopRequested = false;
    for (const b of document.querySelectorAll("#resign, #order, #upload-btn, #resp, #own-toggle, #clear-rec, #replay-btn")) b.disabled = on;
    $("res-card").setAttribute("aria-busy", String(on));
    runLabel();
  }
  function bringResults() {
    // one column: the results are below the button, so bring their heading into view as the run starts
    if (wide()) return;
    $("res-h").scrollIntoView({ block: "start", behavior: reduced() ? "auto" : "smooth" });
  }
  // the run button keeps focus (it is Stop, then Run again); a lost focus lands on the verdict
  function settleFocus() {
    if (!document.activeElement || document.activeElement === document.body) $("verdict").focus({ preventScroll: wide() });
  }

  async function runTest() {
    if (busy || !order.info) return;
    if (order.info.state !== 0) { showRecord(); return; }
    if (isLocal() && !ownMode && (!record || sent.has(digestOf(record)) || nowSec() - Number(record.timestamp) > maxAge - 20)) await signFresh();
    if (ownMode) readBox();
    if (!record || recordErr) {
      needRecord = !record && !recordErr;
      showRecord();
      if (ownMode || !isLocal()) { $("how").open = true; $("resp").focus(); }
      return;
    }
    const age = (await chainNow()) - Number(record.timestamp);
    if (age > maxAge || sent.has(digestOf(record))) {
      resetResults();
      const used = sent.has(digestOf(record));
      verdict("warn", used ? "This record is already on chain" : `This record is ${P.span(age)} old`,
        `With it, every forgery would stop ${used ? "early" : "at the freshness check"}, so the test would show nothing. Get a fresh one (in the record card) and run again.`);
      $("how").open = true;
      bringResults(); settleFocus();
      return;
    }
    resetResults();
    setBusy(true);
    bringResults();
    const results = [];
    try {
      for (const row of ROWS) {
        if (stopRequested) break;
        setRow(row.mode, "running", "asking the contract…");
        const a = await attempt(record, row.mode);
        const state = judge(row, a);
        results.push({ row, a, state });
        setRow(row.mode, state, outText(row, a, state), moreText(row, a, state));
      }
    } catch (e) {
      for (const row of ROWS) if ($("rows").querySelector(`li[data-mode="${row.mode}"]`).className === "running") setRow(row.mode, "", "not asked");
      setBusy(false);
      if (e.record) verdict("bad", "Could not build the forgeries", `${esc(e.message)} Nothing was sent.`);
      else verdict("bad", "Could not ask the contract", `${errHtml(e)} Nothing was sent; press Run to try again.`);
      settleFocus();
      return;
    }
    const stopped = stopRequested && results.length < ROWS.length;
    setBusy(false);
    haveResults = true;
    if (stopped) {
      for (const row of ROWS.slice(results.length)) setRow(row.mode, "", "not asked");
      verdict("done", "Stopped", `After ${results.length} of ${ROWS.length}. Nothing was sent.`);
      runLabel(); settleFocus();
      return;
    }
    const valid = results[0], attacks = results.slice(1);
    const caught = attacks.filter((x) => !x.a.accepted).length;
    if (valid.a.accepted && caught === attacks.length) {
      lastPass = { record };
      verdict("ok", "Passed", "All four forgeries rejected.", replayAction());
    } else if (caught === attacks.length) {
      const n = valid.a.err.name;
      verdict("warn", "Not tested", `The real record was refused (<span class="mono">${esc(n)}</span>): ${esc(FIX[n] || "load a fresh record and run again")}.`);
    } else {
      verdict("bad", "Not passed", `Accepted: ${attacks.filter((x) => x.a.accepted).map((x) => esc(x.row.name)).join(", ")}.`);
    }
    runLabel();
    settleFocus();
  }
  function runClick() {
    if (busy) { stopRequested = true; $("run").innerHTML = `${P.icon("loader", "spin")}Stopping after this attempt…`; return; }
    runTest().catch((e) => { setBusy(false); verdict("bad", "Could not ask the contract", `${errHtml(e)} Nothing was sent; press Run to try again.`); });
  }
  $("run").addEventListener("click", runClick);

  // The replay step, offered under the verdict after a pass: the one real transaction. Local chain: the public agent
  // key, after a second press (nothing else asks); elsewhere MetaMask asks.
  const sendLabel = () => `${P.icon("send")}Send for real, then replay${keysOn() ? `<kbd class="kb-k" aria-hidden="true">S</kbd>` : ""}`;
  function replayAction(msg = "") {
    return `<div class="next"><button type="button" class="primary" id="replay-btn" aria-keyshortcuts="S">${sendLabel()}</button>
      <span class="fresh" id="replay-fresh"></span>${msg ? `<span class="msg" role="status">${msg}</span>` : ""}</div>`;
  }
  // the record behind the replay button keeps ageing: say how long it can still be sent, and stop it once it cannot
  function replayFresh() {
    const b = $("replay-btn"), f = $("replay-fresh");
    if (!b || !f || !lastPass || busy) return;
    const left = maxAge - (nowSec() - Number(lastPass.record.timestamp));
    f.className = "fresh" + (left < 60 ? " warn" : "");
    // quiet while there is time; said only when it matters
    if (left > 60) f.textContent = "";
    else if (left > 0) f.textContent = `Record valid ${P.span(left)}.`;
    else { f.textContent = "Record expired: run again."; b.disabled = true; }
  }
  // armed: the second press (or S) sends; Cancel, Esc or the visible 8 s countdown put it back
  let armTimer = null;
  function armed(btn) {
    if (!isLocal() || btn.dataset.armed) return true;
    let left = 8;
    btn.dataset.armed = "1";
    const label = () => { btn.innerHTML = `${P.icon("send")}Confirm: send for real (${left} s)${keysOn() ? `<kbd class="kb-k" aria-hidden="true">S</kbd>` : ""}`; };
    label();
    btn.insertAdjacentHTML("afterend", `<button type="button" class="link" id="replay-cancel">Cancel${keysOn() ? `<kbd class="kb-k" aria-hidden="true">Esc</kbd>` : ""}</button>`);
    armTimer = setInterval(() => { left -= 1; if (left <= 0) disarm(btn); else label(); }, 1000);
    btn.focus({ preventScroll: true });
    return false;
  }
  function disarm(btn) {
    if (!btn || !btn.dataset.armed) return;
    clearInterval(armTimer);
    delete btn.dataset.armed;
    btn.innerHTML = sendLabel();
    const c = $("replay-cancel"); if (c) c.remove();
  }
  async function sendForReal(r) {
    let signer;
    // Sepolia through the wallet, the local chain only through a local RPC, never inside another site's frame
    if (chainId === 31337 && !P.writeBlocked(chainId, cfg.rpc)) signer = new ethers.Wallet(LOCAL.agent, provider);
    else signer = await P.walletSigner(chainId, cfg.rpc);
    const c = new ethers.Contract(cfg.contract, version === 2 ? P.ABI : P.ABI_V1, signer);
    // the agent's gas limit: a record's cost depends on the block it lands in, so an estimate can run out
    const tx = await c.submitEvidence(order.id, r.requestHash, BigInt(r.timestamp), r.data, r.signature, { gasLimit: 2000000n });
    setRow("replay", "running", `sent ${txLink(tx.hash)}, waiting for the block…`);
    let rc;
    try { rc = await tx.wait(); } catch (e) { rc = e.receipt || null; if (!rc) throw e; } // ethers 6 throws on a reverted receipt
    return { status: rc.status, hash: tx.hash, block: rc.blockNumber };
  }
  const txLink = (h) => explorer ? `<a class="mono" href="${explorer}/tx/${h}" target="_blank" rel="noopener">${short(h)}</a>` : `<span class="mono">${short(h)}</span>`;
  function keepReplay(msg) {
    // a failed or cancelled send keeps its button: the passed test still stands
    const next = $("verdict").querySelector(".next");
    if (next) next.outerHTML = replayAction(msg); else $("verdict").insertAdjacentHTML("beforeend", replayAction(msg));
    P.hydrateIcons($("verdict"));
    $("replay-btn").focus({ preventScroll: true });
  }
  async function replay() {
    if (busy || !lastPass) return;
    const r = lastPass.record;
    setBusy(true);
    $("run").disabled = true;
    $("run").innerHTML = `${P.icon("loader", "spin")}Sending the real record…`;
    setRow("replay", "running", "sending…");
    let s;
    try { s = await sendForReal(r); }
    catch (e) {
      const err = P.decodeRevert(iface, e);
      setRow("replay", "", REPLAY.check);
      setBusy(false); $("run").disabled = false; runLabel();
      keepReplay(err ? `Not sent: the contract refuses it with <span class="mono">${esc(err.name)}</span>. ${esc(P.explain(err.name, err.args))}`
        : e.blocked ? esc(e.message) : errHtml(e));
      return;
    }
    if (s.status !== 1) {
      setRow("replay", "", REPLAY.check);
      setBusy(false); $("run").disabled = false; runLabel();
      keepReplay(`Reverted on chain in block ${s.block} (${txLink(s.hash)}): the record was most likely used or expired between the check and the send. Press Run for a fresh check.`);
      return;
    }
    sent.set(digestOf(r), s.block);
    dropDraft(); // the record is used now
    setRow("replay", "running", "submitting it again…");
    try {
      const a = await attempt(r, "replay");
      const state = a.accepted ? "fail" : a.err.name === "Replayed" ? "pass" : "near";
      setRow("replay", state, a.accepted ? "Accepted: not stopped" : `${state === "pass" ? "Rejected" : "Rejected by an earlier check"}<span class="mono">${esc(a.err.name)}</span>`,
        `<p class="what">Sent for real in block ${s.block} (${txLink(s.hash)}), then submitted once more.</p><p>${esc(a.accepted ? "The contract accepted it a second time." : P.explain(a.err.name, a.err.args))}</p>`);
      lastPass = null;
      setBusy(false); $("run").disabled = false; // the verdict is announced outside a busy region
      if (state === "pass") verdict("ok", "Passed, replay included", `Sent once in block ${s.block} (${txLink(s.hash)}); the copy was rejected.`);
      else verdict("bad", "Not passed", a.accepted ? "Broken: the contract accepted the same record twice." : `The replay was rejected, but by an earlier check (<span class="mono">${esc(a.err.name)}</span>).`);
    } catch (e) {
      setRow("replay", "", "not asked");
      setBusy(false); $("run").disabled = false;
      verdict("warn", "Sent, replay not asked", `The record was sent for real in block ${s.block} (${txLink(s.hash)}), but the second submission could not be asked: ${errHtml(e)} Press Run to test a fresh record.`);
    } finally {
      setBusy(false); $("run").disabled = false; runLabel(); showRecord();
      if (!document.activeElement || document.activeElement === document.body) $("verdict").focus({ preventScroll: true });
    }
  }
  // the result as plain text, for the evidence log: network, contract, order, verdict, each row, the replay's transaction
  async function copyResult(btn) {
    const lines = [`Tamper test, ${P.NETWORKS[chainId] || "chain " + chainId}, contract ${cfg.contract}, order #${order.id}`,
      $("verdict").querySelector(".verdict").innerText.replace(/\s*\n\s*/g, ": ")];
    for (const li of $("rows").querySelectorAll("li")) lines.push(`- ${li.querySelector(".nm b").innerText}: ${li.querySelector(".out").innerText.replace(/\s*\n\s*/g, " ")}`);
    const tx = $("verdict").querySelector('a[href*="/tx/"]') || $("rows").querySelector('a[href*="/tx/"]');
    if (tx) lines.push(`Replay transaction: ${tx.href}`);
    const ok = await P.copyText(lines.join("\n"));
    P.flashLabel(btn, ok ? "Copied" : "Copy failed: select the text instead");
  }
  $("res-card").addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t || t.disabled) return;
    if (t.id === "copy-result") { copyResult(t); return; }
    if (t.id === "replay-btn") { if (armed(t)) { disarm(t); replay().catch(() => setBusy(false)); } }
    else if (t.id === "replay-cancel") { const b = $("replay-btn"); disarm(b); if (b) b.focus(); }
  });

  // ---------------------------------------------------------------- the guide: the page, one step at a time

  function guideSteps() {
    return [
      { title: "Try to break it", text: "The contract pays a supplier only on a fresh company-register record (Companies House or GLEIF) signed by API3's Airnode. Here you forge that record four ways. A sound contract refuses every forgery and accepts only the real record." },
      { el: ".view-switch", title: "Simple or Detailed", text: "Simple runs the whole test in one click. Detailed adds attacks with genuine old records, every check per attempt, a scoreboard and the judge kit." },
      { el: "#ctx", title: "The live contract", text: "Every answer comes from this contract. Each attempt is an <span class=\"mono\">eth_call</span> simulation from <span class=\"mono\">0x…dEaD</span>: nothing is sent, no wallet, no gas." },
      { el: "#order", title: "Pick an order", text: "A purchase order pays its supplier milestone by milestone. The record must be about this order's supplier; a held or closed order refuses every record." },
      { el: "#rec-card", title: "The signed record", text: isLocal() ? "On the local test chain a fresh record is signed for you with a public test key. <b>Use my own</b> lets you paste one instead." : `Paste, upload or drop a record from <span class="mono">fetch-evidence.sh</span> ($0.01 in test aUSD, valid ${dur(maxAge)}). No record? <b>Try without one</b> attacks two genuine old records in the detailed view.` },
      { el: "#run", title: "Run the test", text: "One click asks the contract about the real record and four forgeries: (a) one signed value edited, (b) dated an hour earlier, (c) another company's request, (d) re-signed by a random key. Key: <kbd>R</kbd>; <kbd>Esc</kbd> stops." },
      { el: "#rows", title: "Read the result", text: "Each row is the contract's own answer, with its error name. Green means it behaved as it should. Open a row for the exact change and the reason; <b>Copy result</b> copies all of it." },
      { el: () => $("replay-btn") || $("rows").querySelector('li[data-mode="replay"]'), title: "Then the replay", text: "After a pass, send the real record once for real (the only transaction), then submit it again: the contract must refuse the copy. On the local chain the button asks twice." },
      { el: "#help", title: "More", text: "<b>How the contract decides</b> lists every check in order and which forgery it stops. Keys: <kbd>R</kbd> run, <kbd>S</kbd> send, <kbd>?</kbd> help, <kbd>T</kbd> theme; you can switch them off there." },
    ];
  }
  $("guide-btn").addEventListener("click", () => P.tour(guideSteps(), { returnTo: $("guide-btn") }));

  // ---------------------------------------------------------------- keys: R run, Esc stop, S send and replay, ? help, T theme

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable]")) return;
    const k = e.key;
    if (!keysOn() && k !== "Escape") return;
    if ((k === "r" || k === "R") && !busy && !$("run").disabled) { e.preventDefault(); runClick(); }
    else if ((k === "o" || k === "O") && !$("order").disabled) { e.preventDefault(); $("order").focus(); }
    else if (/^[1-6]$/.test(k)) { const d = $("rows").querySelectorAll("details")[Number(k) - 1]; if (d) { e.preventDefault(); d.open = !d.open; d.querySelector("summary").focus(); } }
    else if (k === "Escape" && busy && !$("run").disabled) { e.preventDefault(); runClick(); }
    else if (k === "Escape" && $("replay-btn") && $("replay-btn").dataset.armed) { e.preventDefault(); const b = $("replay-btn"); disarm(b); b.focus(); }
    else if (k === "Escape" && $("help").open) { e.preventDefault(); $("help").open = false; $("help").querySelector("summary").focus(); }
    else if ((k === "s" || k === "S") && !busy && $("replay-btn") && !$("replay-btn").disabled) { e.preventDefault(); $("replay-btn").click(); }
    else if (k === "?") { e.preventDefault(); const h = $("help"); h.open = !h.open; h.querySelector("summary").focus(); if (h.open) h.scrollIntoView({ block: "nearest" }); }
    else if (k === "t" || k === "T") { e.preventDefault(); nextTheme(); }
  });

  // ---------------------------------------------------------------- orders and start

  async function selectOrder(id) {
    // while the new order is read, nothing runs against a half-switched order
    loadingOrder = true;
    $("run").disabled = $("order").disabled = true;
    recLine("wait", `Reading order #${id}…`);
    let info, airnode;
    try { info = await readOrder(id); airnode = await airnodeFor(info.source); }
    finally { loadingOrder = false; $("order").disabled = false; $("run").disabled = false; }
    order.id = id; order.info = info; order.airnode = airnode;
    const q = new URLSearchParams(location.search);
    q.set("order", id);
    history.replaceState(null, "", "?" + q);
    const s = P.SOURCES[order.info.source];
    $("order-hint").innerHTML = `${esc(s.name)} <span class="mono">${esc(order.info.supplierId)}</span> · signer: ${esc(signerName(order.airnode))}`;
    viewLinks(); howToGet(); helpText();
    if (isLocal() && !ownMode) await signFresh(); else { readBox(); showRecord(); }
    markStale();
    runLabel();
  }
  $("order").addEventListener("change", (e) => selectOrder(Number(e.target.value)).catch((err) => recLine("bad", errHtml(err))));
  $("help-body").addEventListener("change", (e) => {
    if (e.target.id !== "keys-on") return;
    try { localStorage.setItem("pulse-judge-keys", e.target.checked ? "on" : "off"); } catch { /* storage blocked */ }
    applyTheme(); runLabel(); const b = $("replay-btn"); if (b && !b.dataset.armed) b.innerHTML = sendLabel();
  });

  async function init() {
    resetResults();
    recLine("wait", "Connecting to the network…");
    provider = new ethers.JsonRpcProvider(cfg.rpc, undefined, { staticNetwork: true });
    chainId = Number((await provider.getNetwork()).chainId);
    explorer = P.EXPLORERS[chainId] || null;
    if (!cfg.contract) {
      recLine("wait", "Looking for the newest SupplierPulse contract…");
      const v2 = await P.discoverV2(provider);
      if (v2) cfg.contract = v2;
      else if (chainId === 11155111) cfg.contract = P.V1_SEPOLIA;
      else throw new Error("No SupplierPulse contract found on this network.");
    }
    if ((await provider.getCode(cfg.contract)) === "0x") throw new Error(`no contract at ${cfg.contract} on chain ${chainId}`);
    contract = new ethers.Contract(cfg.contract, P.ABI, provider);
    try { await contract.airnodeOf(0); version = 2; }
    catch { version = 1; contract = new ethers.Contract(cfg.contract, P.ABI_V1, provider); iface = contract.interface; }
    maxAge = Number(await contract.maxAge());
    const contractLink = explorer ? `<a class="mono" href="${explorer}/address/${cfg.contract}" target="_blank" rel="noopener">${short(cfg.contract)}</a>` : `<span class="mono">${short(cfg.contract)}</span>`;
    $("ctx").innerHTML = `<span class="live-dot"></span><b>${esc(P.NETWORKS[chainId] || `chain ${chainId}`)}</b> · ${contractLink}`;
    $("local-acts").hidden = !isLocal();
    $("own").hidden = isLocal();
    ownMode = !isLocal();
    viewLinks(); helpText();
    const count = Number(await contract.ordersLength());
    if (!count) { $("order").innerHTML = "<option>No orders yet</option>"; recLine("warn", "This contract has no orders yet: there is nothing to attack. The buyer creates one with api3/scripts/plus-create-order.sh."); return; }
    recLine("wait", `Reading ${count} order${count === 1 ? "" : "s"}…`);
    // the newest 50 orders: anyone can create orders, and a malicious contract can claim any count
    const first = Math.max(0, count - 50), ids = [...Array(count - first).keys()].map((k) => k + first);
    const infos = await Promise.all(ids.map((i) => readOrder(i)));
    infos.forEach((o, k) => { o.id = ids[k]; });
    allOrders = infos;
    // the state first: it decides whether the contract accepts any record for the order
    $("order").innerHTML = infos.map((o) => { const i = o.id; const n = nameOf(o.orderRef, o.supplierId); return `<option value="${i}">${P.STATE[o.state]} · #${i}${n ? " " + esc(n) : ""} · ${P.SOURCES[o.source].badge} ${esc(o.supplierId)}</option>`; }).join("");
    if (!isLocal() && !$("resp").value) { const d = loadDraft(); if (d) { $("resp").value = d; $("clear-rec").disabled = false; } }
    // a held or closed order refuses every record: start on the first active one unless the URL names an order
    const asked = cfg.order !== null && ids.includes(Number(cfg.order)) ? Number(cfg.order) : -1;
    const want = asked >= 0 ? asked : (infos.find((o) => o.state === 0) || infos[0]).id;
    $("order").value = String(want);
    $("order").disabled = false;
    await selectOrder(want);
    $("run").disabled = false;
  }
  function start() {
    init().catch((e) => {
      const f = P.friendlyError(e, { rpc: cfg.rpc, reading: true, contract: cfg.contract });
      $("ctx").textContent = "Not connected.";
      recLine("bad", `${esc(e.message && e.message.startsWith("No SupplierPulse") ? e.message : f.text.replace(/ in Settings/g, ""))} <button type="button" class="link" id="retry">Try again</button> · <a href="${detailedHref()}">open the detailed view</a> to change the contract or the network in its Settings.`);
      $("retry").addEventListener("click", start);
    });
  }
  start();
})();
</script>
</body>
